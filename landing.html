<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&display=swap" rel="stylesheet">
<script>
  // If ?signout=1 → clear auth and stay on the lock screen.
  // Otherwise, if already authed → go straight to the Edges page.
  try {
    const params = new URLSearchParams(location.search);
    if (params.get('signout') === '1') {
      localStorage.removeItem('yangmma_auth');
      history.replaceState(null, '', location.pathname);
    } else if (localStorage.getItem('yangmma_auth') === '1') {
      location.replace('./');
    }
  } catch (e) {}
</script>
<style>
  :root {
    color-scheme: dark;
    --bg: #000000;
    --surface: #1c1c1e;
    --surface-3: #2c2c2e;
    --separator: #38383a;
    --text-primary: #ffffff;
    --text-secondary: #aeaeb2;
    --text-muted: #8e8e93;
    --brand: #0a84ff;
    --brand-dark: #409cff;
    --red: #ff453a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: var(--bg);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Segoe UI', system-ui, sans-serif;
    font-size: 14px;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .lock-screen {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px 16px;
  }
  .lock-card {
    background: var(--surface);
    border-radius: 18px;
    border: 0.5px solid var(--separator);
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    padding: 48px 32px 36px;
    width: 100%;
    max-width: 380px;
    text-align: center;
  }
  .wordmark {
    font-family: 'Orbitron', 'Eurostile', sans-serif;
    font-size: 80px;
    font-weight: 900;
    letter-spacing: 0.04em;
    line-height: 1;
    text-transform: uppercase;
    background: linear-gradient(135deg, var(--brand) 0%, var(--brand-dark) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: var(--brand);
    margin-bottom: 4px;
  }
  .tagline {
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 32px;
    letter-spacing: -0.01em;
  }
  .lock-form { display: flex; flex-direction: column; gap: 10px; }
  .lock-form input {
    width: 100%;
    padding: 14px 16px;
    border-radius: 10px;
    border: 1px solid var(--separator);
    background: var(--surface-3);
    color: var(--text-primary);
    font: inherit;
    font-size: 15px;
    outline: none;
    text-align: center;
    letter-spacing: 0.04em;
    transition: border-color 0.15s, background 0.15s;
  }
  .lock-form input:focus { border-color: var(--brand); background: var(--surface); }
  .lock-form input.shake { animation: shake 0.36s; border-color: var(--red); }
  @keyframes shake {
    10%, 90% { transform: translateX(-1px); }
    20%, 80% { transform: translateX(2px); }
    30%, 50%, 70% { transform: translateX(-4px); }
    40%, 60% { transform: translateX(4px); }
  }
  .lock-form button {
    width: 100%;
    padding: 13px 16px;
    border-radius: 10px;
    border: none;
    background: var(--brand);
    color: #ffffff;
    font: inherit;
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
    transition: background 0.12s, transform 0.12s;
  }
  .lock-form button:hover { background: var(--brand-dark); transform: translateY(-1px); }
  .lock-error {
    margin-top: 12px;
    font-size: 12px;
    color: var(--red);
    visibility: hidden;
    height: 16px;
    letter-spacing: 0.01em;
  }
  .lock-error.visible { visibility: visible; }

  @media (max-width: 720px) {
    .lock-card { padding: 36px 22px 26px; }
    .wordmark { font-size: 64px; }
  }
  /* ============================================================
     USA 250 — Patriotic theme (Freedom 250). Appended overrides;
     delete this block to revert.
     ============================================================ */
  :root {
    --bg: #0a0f2c;
    --brand: #5a78ff;
    --brand-dark: #8aa0ff;
    --red: #e23b4e;
  }
  html { background: #070a22; }
  body { background: transparent; }
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -2; pointer-events: none;
    background:
      radial-gradient(ellipse 60% 50% at 12% -5%, rgba(60,90,255,0.30), transparent 60%),
      radial-gradient(ellipse 60% 50% at 88% -5%, rgba(226,59,78,0.24), transparent 60%),
      radial-gradient(ellipse 90% 60% at 50% 112%, rgba(60,90,255,0.20), transparent 60%),
      #070a22;
  }
  body::after {
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    opacity: 0.6;
    background-image:
      radial-gradient(1.6px 1.6px at 30px 40px, #fff, transparent),
      radial-gradient(1.6px 1.6px at 200px 150px, #fff, transparent),
      radial-gradient(1.3px 1.3px at 160px 30px, rgba(255,255,255,0.95), transparent),
      radial-gradient(1.1px 1.1px at 120px 90px, rgba(255,255,255,0.8), transparent),
      radial-gradient(1.1px 1.1px at 80px 200px, rgba(255,255,255,0.75), transparent),
      radial-gradient(1.1px 1.1px at 250px 80px, rgba(255,255,255,0.7), transparent),
      radial-gradient(1.3px 1.3px at 240px 220px, rgba(255,255,255,0.85), transparent);
    background-size: 280px 280px;
    background-repeat: repeat;
    animation: usaTwinkle 6s ease-in-out infinite;
  }
  @keyframes usaTwinkle { 0%, 100% { opacity: 0.55; } 50% { opacity: 0.75; } }
  .lock-card {
    background: rgba(16, 22, 56, 0.78) !important;
    border: 1px solid rgba(120, 150, 255, 0.28) !important;
    box-shadow: 0 10px 44px rgba(0,0,0,0.6), 0 0 0 1px rgba(226,59,78,0.12) !important;
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  }
  .wordmark {
    background-image: linear-gradient(120deg, #ff5d6c 0%, #ffffff 50%, #5a78ff 100%) !important;
    background-color: transparent !important;
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .wordmark::after {
    content: "\2605  250 Years of Freedom  \2605";
    display: block; margin-top: 14px;
    font-size: 11px; font-weight: 800; letter-spacing: 0.20em; text-transform: uppercase;
    color: #ffcf4d; -webkit-text-fill-color: #ffcf4d;
  }
  .tagline::before { content: "1776 \2014 2026  \00B7  "; color: #ffcf4d; font-weight: 600; }
  .landing-flag { display: block; width: 132px; height: 69.5px; margin: 0 auto 22px;
    border-radius: 3px; box-shadow: 0 4px 18px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.22),
      0 0 36px rgba(60,90,255,0.30);
    transform-origin: center bottom; animation: usaWave 3.6s ease-in-out infinite; }
  @keyframes usaWave { 0%,100% { transform: rotate(-2.2deg); } 50% { transform: rotate(2.2deg); } }
</style>
</head>
<body>

<!-- Reusable US flag (inline SVG; flag emoji don't render on Windows) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><symbol id="usFlag" viewBox="0 0 76 40" preserveAspectRatio="xMidYMid meet">
  <rect width="76" height="40" fill="#b22234"/>
  <g fill="#fff"><rect y="3.08" width="76" height="3.08"/><rect y="9.23" width="76" height="3.08"/><rect y="15.38" width="76" height="3.08"/><rect y="21.54" width="76" height="3.08"/><rect y="27.69" width="76" height="3.08"/><rect y="33.85" width="76" height="3.08"/></g>
  <rect width="30.4" height="21.54" fill="#3c3b6e"/>
  <g fill="#fff">
    <circle cx="2.9" cy="2.6" r="0.9"/><circle cx="7.9" cy="2.6" r="0.9"/><circle cx="12.9" cy="2.6" r="0.9"/><circle cx="17.9" cy="2.6" r="0.9"/><circle cx="22.9" cy="2.6" r="0.9"/><circle cx="27.9" cy="2.6" r="0.9"/>
    <circle cx="5.4" cy="6.9" r="0.9"/><circle cx="10.4" cy="6.9" r="0.9"/><circle cx="15.4" cy="6.9" r="0.9"/><circle cx="20.4" cy="6.9" r="0.9"/><circle cx="25.4" cy="6.9" r="0.9"/>
    <circle cx="2.9" cy="11.1" r="0.9"/><circle cx="7.9" cy="11.1" r="0.9"/><circle cx="12.9" cy="11.1" r="0.9"/><circle cx="17.9" cy="11.1" r="0.9"/><circle cx="22.9" cy="11.1" r="0.9"/><circle cx="27.9" cy="11.1" r="0.9"/>
    <circle cx="5.4" cy="15.4" r="0.9"/><circle cx="10.4" cy="15.4" r="0.9"/><circle cx="15.4" cy="15.4" r="0.9"/><circle cx="20.4" cy="15.4" r="0.9"/><circle cx="25.4" cy="15.4" r="0.9"/>
    <circle cx="2.9" cy="19.6" r="0.9"/><circle cx="7.9" cy="19.6" r="0.9"/><circle cx="12.9" cy="19.6" r="0.9"/><circle cx="17.9" cy="19.6" r="0.9"/><circle cx="22.9" cy="19.6" r="0.9"/><circle cx="27.9" cy="19.6" r="0.9"/>
  </g>
</symbol></svg>

<div class="lock-screen">
  <div class="lock-card">
    <svg class="landing-flag"><use href="#usFlag"/></svg>
    <h1 class="wordmark">Yang</h1>
    <div class="tagline">Enter password to continue</div>
    <form class="lock-form" id="lock-form" autocomplete="off">
      <input type="password" id="lock-pw" placeholder="Password" autofocus aria-label="Password">
      <button type="submit">Unlock</button>
    </form>
    <div class="lock-error" id="lock-error">Incorrect password</div>
  </div>
</div>

<script>
const APP_PW = 'yang32';
document.getElementById('lock-form').addEventListener('submit', e => {
  e.preventDefault();
  const inp = document.getElementById('lock-pw');
  const err = document.getElementById('lock-error');
  if (inp.value === APP_PW) {
    try { localStorage.setItem('yangmma_auth', '1'); } catch (_) {}
    location.replace('./');
  } else {
    err.classList.add('visible');
    inp.classList.add('shake');
    setTimeout(() => inp.classList.remove('shake'), 360);
    inp.select();
  }
});
</script>
</body>
</html>
