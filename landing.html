<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&display=swap" rel="stylesheet">
<script>
  // If ?signout=1 → clear auth and stay on the lock screen.
  // Otherwise, if already authed → go straight to the Edges page.
  try {
    const params = new URLSearchParams(location.search);
    if (params.get('signout') === '1') {
      localStorage.removeItem('yangmma_auth');
      history.replaceState(null, '', location.pathname);
    } else if (localStorage.getItem('yangmma_auth') === '1') {
      location.replace('./');
    }
  } catch (e) {}
</script>
<style>
  :root {
    color-scheme: dark;
    --bg: #000000;
    --surface: #1c1c1e;
    --surface-3: #2c2c2e;
    --separator: #38383a;
    --text-primary: #ffffff;
    --text-secondary: #aeaeb2;
    --text-muted: #8e8e93;
    --brand: #0a84ff;
    --brand-dark: #409cff;
    --red: #ff453a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: var(--bg);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Segoe UI', system-ui, sans-serif;
    font-size: 14px;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .lock-screen {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px 16px;
  }
  .lock-card {
    background: var(--surface);
    border-radius: 18px;
    border: 0.5px solid var(--separator);
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    padding: 48px 32px 36px;
    width: 100%;
    max-width: 380px;
    text-align: center;
  }
  .wordmark {
    font-family: 'Orbitron', 'Eurostile', sans-serif;
    font-size: 80px;
    font-weight: 900;
    letter-spacing: 0.04em;
    line-height: 1;
    text-transform: uppercase;
    background: linear-gradient(135deg, var(--brand) 0%, var(--brand-dark) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: var(--brand);
    margin-bottom: 4px;
  }
  .tagline {
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 32px;
    letter-spacing: -0.01em;
  }
  .lock-form { display: flex; flex-direction: column; gap: 10px; }
  .lock-form input {
    width: 100%;
    padding: 14px 16px;
    border-radius: 10px;
    border: 1px solid var(--separator);
    background: var(--surface-3);
    color: var(--text-primary);
    font: inherit;
    font-size: 15px;
    outline: none;
    text-align: center;
    letter-spacing: 0.04em;
    transition: border-color 0.15s, background 0.15s;
  }
  .lock-form input:focus { border-color: var(--brand); background: var(--surface); }
  .lock-form input.shake { animation: shake 0.36s; border-color: var(--red); }
  @keyframes shake {
    10%, 90% { transform: translateX(-1px); }
    20%, 80% { transform: translateX(2px); }
    30%, 50%, 70% { transform: translateX(-4px); }
    40%, 60% { transform: translateX(4px); }
  }
  .lock-form button {
    width: 100%;
    padding: 13px 16px;
    border-radius: 10px;
    border: none;
    background: var(--brand);
    color: #ffffff;
    font: inherit;
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
    transition: background 0.12s, transform 0.12s;
  }
  .lock-form button:hover { background: var(--brand-dark); transform: translateY(-1px); }
  .lock-error {
    margin-top: 12px;
    font-size: 12px;
    color: var(--red);
    visibility: hidden;
    height: 16px;
    letter-spacing: 0.01em;
  }
  .lock-error.visible { visibility: visible; }

  @media (max-width: 720px) {
    .lock-card { padding: 36px 22px 26px; }
    .wordmark { font-size: 64px; }
  }

  html { background: #070a22; }

  body::before {

  /* ===== USA 250 — LIGHT patriotic theme (landing) ===== */
  :root {
    color-scheme: light;
    --bg: #ffffff; --surface: #ffffff; --surface-3: #eef1f6; --separator: #e2e6ee;
    --text-primary: #11183a; --text-secondary: #5b6478; --text-muted: #8a92a6;
    --brand: #1f44c4; --brand-dark: #3a5bd9; --red: #d11f2e;
  }
  html { background: #ffffff; }
  body { background: transparent; }
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -2; pointer-events: none;
    background:
      radial-gradient(ellipse 60% 50% at 8% -8%, rgba(31,68,196,0.08), transparent 60%),
      radial-gradient(ellipse 60% 50% at 92% -8%, rgba(200,16,46,0.07), transparent 60%),
      #ffffff;

  body::after { content: none !important; display: none !important; animation: none !important; }

    background: #ffffff !important; border: 1px solid #e2e6ee !important;
    box-shadow: 0 10px 40px rgba(15,23,42,0.10) !important; }

    background-image: linear-gradient(120deg, #c8102e 0%, #1f44c4 100%) !important;
    background-color: transparent !important; }

  .tagline::before { color: #b8902e; }

  .lock-form input::placeholder { color: #9aa3b2; }
  .lock-form input:focus { background: #ffffff; border-color: var(--brand); }

<body>

<div class="lock-screen">
  <div class="lock-card">
    <div class="landing-flag"></div>
    <h1 class="wordmark">Yang</h1>
    <div class="tagline">Enter password to continue</div>
    <form class="lock-form" id="lock-form" autocomplete="off">
      <input type="password" id="lock-pw" placeholder="Password" autofocus aria-label="Password">
      <button type="submit">Unlock</button>
    </form>
    <div class="lock-error" id="lock-error">Incorrect password</div>
  </div>
</div>

<script>
const APP_PW = 'yang32';
document.getElementById('lock-form').addEventListener('submit', e => {
  e.preventDefault();
  const inp = document.getElementById('lock-pw');
  const err = document.getElementById('lock-error');
  if (inp.value === APP_PW) {
    try { localStorage.setItem('yangmma_auth', '1'); } catch (_) {}
    location.replace('./');
  } else {
    err.classList.add('visible');
    inp.classList.add('shake');
    setTimeout(() => inp.classList.remove('shake'), 360);
    inp.select();
  }
});
</script>
</body>
