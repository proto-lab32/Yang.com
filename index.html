<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UFC Edge Sheet — UFC 328</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* Backgrounds */
    --bg: #0a0c14;
    --surface: #11141d;
    --surface-2: #161a26;
    --surface-3: #1d2230;
    /* Borders */
    --border: #1f2434;
    --border-bright: #2c3147;
    /* Text */
    --text-primary: #eef0f8;
    --text-secondary: #a0a6c5;
    --text-muted: #5b6088;
    /* Brand — used SPARINGLY (badge identity only) */
    --brand: #f0b429;
    --brand-soft: rgba(240, 180, 41, 0.10);
    /* Edge tiers — hue + brightness gradient for clear magnitude scanning */
    --edge-monster: #4ade80;   /* >+20% — vivid lime, JUMPS */
    --edge-strong:  #22c55e;   /* +10–20% — clear green */
    --edge-mild:    #15803d;   /* +5–10% — forest */
    --edge-slight:  #4d6e5e;   /* 0–+5% — dim olive */
    --edge-zero:    #6b7280;   /* 0% — neutral gray */
    --edge-neg-1:   #8a6168;   /* -5–0% — muted rose */
    --edge-neg-2:   #ef4444;   /* <-5% — clear red */
    /* Type scale — 4 sizes only */
    --text-xs: 11px;
    --text-sm: 13px;
    --text-md: 15px;
    --text-lg: 18px;
    /* Layout */
    --header-h: 56px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: var(--bg); color: var(--text-primary); font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 13px; min-height: 100vh; -webkit-font-smoothing: antialiased; }

  /* HEADER */
  header { height: var(--header-h); background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; position: sticky; top: 0; z-index: 100; }
  .header-left { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .event-title { font-size: var(--text-lg); font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .event-date { font-family: 'IBM Plex Mono', monospace; font-size: var(--text-xs); color: var(--text-muted); letter-spacing: 0.02em; }
  .header-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .badge { font-size: var(--text-xs); font-weight: 600; letter-spacing: 0.02em; padding: 4px 9px; border-radius: 4px; white-space: nowrap; }
  .badge-yang { background: var(--brand-soft); color: var(--brand); border: 1px solid rgba(240, 180, 41, 0.25); }
  .badge-count { background: var(--surface-2); color: var(--text-secondary); border: 1px solid var(--border); }
  .refresh-btn {
    font-size: var(--text-xs); font-weight: 600;
    letter-spacing: 0.02em;
    padding: 6px 11px; border-radius: 4px; cursor: pointer;
    background: transparent; color: var(--text-secondary);
    border: 1px solid var(--border-bright); display: flex; align-items: center; gap: 6px;
    transition: all 0.15s;
  }
  .refresh-btn:hover { border-color: var(--text-secondary); color: var(--text-primary); }
  .refresh-btn.loading { opacity: 0.5; pointer-events: none; }
  .refresh-btn .spin { display: inline-block; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* LIVE BAR */
  .live-bar {
    display: flex; align-items: center; gap: 14px;
    padding: 7px 16px;
    background: rgba(0,0,0,0.25);
    border-bottom: 1px solid var(--border);
    font-family: 'IBM Plex Mono', monospace; font-size: var(--text-xs);
    white-space: nowrap;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .live-bar::-webkit-scrollbar { display: none; }
  .live-bar > * { flex-shrink: 0; }
  .live-status { display: flex; align-items: center; gap: 7px; }
  .live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-muted); flex-shrink: 0; }
  .live-dot.ok { background: var(--edge-strong); box-shadow: 0 0 8px rgba(34, 197, 94, 0.45); }
  .live-dot.err { background: var(--edge-neg-2); }
  .live-dot.fetching { background: var(--brand); animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  .live-label { color: var(--text-secondary); }
  .live-time, .live-book { color: var(--text-muted); }
  .live-calls { color: var(--text-muted); margin-left: auto; }

  /* TOP EDGES PANEL */
  .top-edges {
    margin: 14px 16px 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .top-edges-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px;
    background: linear-gradient(180deg, rgba(240,180,41,0.10), rgba(240,180,41,0.02));
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    user-select: none;
  }
  .top-edges.collapsed .top-edges-header { border-bottom: none; }
  .top-edges-title { font-size: var(--text-xs); font-weight: 800; letter-spacing: 0.10em; text-transform: uppercase; color: var(--brand); }
  .top-edges-toggle { color: var(--text-muted); font-size: 11px; transition: transform 0.2s; }
  .top-edges.collapsed .top-edges-toggle { transform: rotate(-90deg); }
  .top-edges.collapsed .top-edges-list { display: none; }
  .top-edges-list { padding: 4px 0; }
  .top-edge-item {
    display: grid;
    grid-template-columns: 28px 1fr auto;
    gap: 12px;
    align-items: center;
    padding: 10px 16px;
    cursor: pointer;
    border-bottom: 1px solid rgba(255,255,255,0.025);
    transition: background 0.1s;
  }
  .top-edge-item:last-child { border-bottom: none; }
  .top-edge-item:hover { background: var(--surface-3); }
  .top-edge-rank { font-family: 'IBM Plex Mono', monospace; font-size: var(--text-xs); color: var(--text-muted); text-align: center; }
  .top-edge-prop-name { color: var(--text-primary); font-size: var(--text-sm); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top-edge-fight { font-family: 'IBM Plex Mono', monospace; font-size: var(--text-xs); color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 3px; }
  .top-edge-value { font-family: 'IBM Plex Mono', monospace; font-size: var(--text-md); font-weight: 700; text-align: right; padding-left: 8px; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }

  /* CONTROLS */
  .controls {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    scrollbar-width: thin;
    -webkit-overflow-scrolling: touch;
  }
  .controls::-webkit-scrollbar { height: 4px; }
  .controls::-webkit-scrollbar-thumb { background: var(--border-bright); border-radius: 2px; }
  .controls-row { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .controls-label { font-size: var(--text-xs); font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-muted); margin-right: 2px; flex-shrink: 0; }
  .pill-btn {
    font-size: var(--text-xs); font-weight: 600;
    letter-spacing: 0.02em;
    padding: 6px 11px; border-radius: 4px; border: 1px solid var(--border-bright);
    background: transparent; color: var(--text-secondary); cursor: pointer; transition: all 0.15s;
    white-space: nowrap; flex-shrink: 0;
  }
  .pill-btn:hover { border-color: var(--text-secondary); color: var(--text-primary); }
  .pill-btn.active { background: var(--text-primary); color: var(--bg); border-color: var(--text-primary); }
  .divider { width: 1px; height: 18px; background: var(--border); margin: 0 4px; flex-shrink: 0; }
  .fight-select {
    font-size: var(--text-xs); font-weight: 600;
    letter-spacing: 0.02em;
    padding: 6px 28px 6px 11px; border-radius: 4px;
    border: 1px solid var(--border-bright);
    background: transparent; color: var(--text-secondary);
    cursor: pointer; flex-shrink: 0;
    appearance: none; -webkit-appearance: none; -moz-appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path fill='%23a0a6c5' d='M5 6L0 0h10z'/></svg>");
    background-repeat: no-repeat;
    background-position: right 9px center;
    max-width: 180px;
    text-overflow: ellipsis;
    outline: none;
  }
  .fight-select:hover { border-color: var(--text-secondary); color: var(--text-primary); }
  .fight-select.active-pin { border-color: var(--text-primary); color: var(--text-primary); background-color: rgba(255,255,255,0.04); }
  .fight-select option { background: var(--surface); color: var(--text-primary); }

  /* FILTER POPOVER */
  .filter-btn { display: flex; align-items: center; gap: 6px; }
  .filter-btn .filter-caret { font-size: 9px; color: var(--text-muted); transition: transform 0.15s; }
  .filter-btn.open .filter-caret { transform: rotate(180deg); }
  .filter-btn .filter-count {
    display: none;
    background: var(--brand);
    color: var(--bg);
    border-radius: 10px;
    padding: 1px 6px 0;
    font-size: 9px;
    font-weight: 700;
    line-height: 1.4;
    min-width: 16px;
    text-align: center;
  }
  .filter-btn.has-active .filter-count { display: inline-block; }
  .filter-btn.has-active { border-color: var(--text-primary); color: var(--text-primary); }

  .filter-panel {
    display: none;
    position: fixed;
    z-index: 200;
    width: 280px;
    max-width: calc(100vw - 16px);
    background: var(--surface);
    border: 1px solid var(--border-bright);
    border-radius: 8px;
    box-shadow: 0 18px 36px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.02);
    padding: 12px;
    user-select: none;
  }
  .filter-panel.open { display: block; }
  .filter-section { margin-bottom: 14px; }
  .filter-section:last-of-type { margin-bottom: 0; }
  .filter-section-title {
    font-size: 10px; font-weight: 700;
    letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 4px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }
  .filter-section-hint {
    font-size: 10px;
    color: var(--text-muted);
    margin-bottom: 4px;
    font-style: italic;
  }
  .filter-option {
    display: flex; align-items: center; gap: 9px;
    padding: 6px 8px;
    font-size: var(--text-sm);
    color: var(--text-secondary);
    cursor: pointer;
    border-radius: 4px;
    transition: background 0.1s, color 0.1s;
  }
  .filter-option:hover { background: var(--surface-3); color: var(--text-primary); }
  .filter-option input { cursor: pointer; accent-color: var(--brand); width: 14px; height: 14px; flex-shrink: 0; }
  .filter-option input:checked + span { color: var(--text-primary); font-weight: 500; }
  .filter-actions {
    display: flex; gap: 8px;
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
  }
  .filter-actions button {
    flex: 1;
    padding: 7px 10px;
    font-family: inherit;
    font-size: var(--text-xs);
    font-weight: 600;
    letter-spacing: 0.02em;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .filter-reset {
    background: transparent;
    color: var(--text-secondary);
    border: 1px solid var(--border-bright);
  }
  .filter-reset:hover { color: var(--text-primary); border-color: var(--text-secondary); }
  .filter-done {
    background: var(--text-primary);
    color: var(--bg);
    border: 1px solid var(--text-primary);
  }
  .filter-done:hover { opacity: 0.9; }

  .search-wrap { position: relative; flex-shrink: 0; }
  .search-wrap input { font-family: 'IBM Plex Mono', monospace; font-size: var(--text-xs); background: var(--bg); border: 1px solid var(--border-bright); border-radius: 4px; color: var(--text-primary); padding: 6px 10px 6px 26px; width: 160px; outline: none; }
  .search-wrap input:focus { border-color: var(--text-secondary); }
  .search-wrap input::placeholder { color: var(--text-muted); }
  .search-icon { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 12px; pointer-events: none; }

  /* CONTENT */
  .content { padding: 14px 16px 32px; display: flex; flex-direction: column; gap: 12px; }
  .empty-state { padding: 40px 20px; text-align: center; color: var(--text-muted); font-size: var(--text-sm); }

  /* FIGHT BLOCK */
  .fight-block { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--surface); }
  .fight-block.collapsed .fight-body { display: none; }

  .fight-header {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 12px;
    padding: 14px 18px;
    background: var(--surface-2);
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    user-select: none;
    transition: background 0.12s;
  }
  .fight-header:hover { background: var(--surface-3); }
  .fight-block.collapsed .fight-header { border-bottom: none; }

  .fight-matchup { min-width: 0; }
  .fight-matchup-line { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .fighter-name { font-size: var(--text-md); font-weight: 700; letter-spacing: -0.01em; line-height: 1.2; }
  .vs { font-size: var(--text-xs); font-weight: 500; color: var(--text-muted); letter-spacing: 0.06em; text-transform: uppercase; }
  .live-badge { font-size: 10px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; padding: 2px 6px; border-radius: 3px; background: rgba(34, 197, 94, 0.15); color: var(--edge-strong); border: 1px solid rgba(34, 197, 94, 0.3); margin-left: 6px; }

  .fight-summary { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .summary-chip {
    display: flex; align-items: center; gap: 7px;
    padding: 6px 11px;
    background: rgba(255, 255, 255, 0.025);
    border: 1px solid var(--border);
    border-radius: 4px;
    font-family: 'IBM Plex Mono', monospace;
    white-space: nowrap;
  }
  .summary-chip-label { font-family: 'Inter', sans-serif; font-size: 10px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-muted); }
  .summary-chip-value { font-size: var(--text-sm); font-weight: 700; color: var(--text-primary); }
  .fight-toggle { color: var(--text-muted); font-size: 14px; transition: transform 0.2s; flex-shrink: 0; padding-left: 2px; }
  .fight-block.collapsed .fight-toggle { transform: rotate(-90deg); }

  /* PROP LIST */
  .prop-list { display: flex; flex-direction: column; }
  .prop-list-header,
  .prop-row {
    display: grid;
    grid-template-columns: 100px 1fr 64px 64px 110px;
    gap: 14px;
    align-items: center;
    padding: 11px 18px;
  }
  .prop-list-header {
    background: rgba(0,0,0,0.2);
    border-bottom: 1px solid var(--border);
    font-size: 10px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--text-muted);
    padding: 9px 18px;
  }
  .prop-list-header .num { text-align: right; }
  .prop-row {
    border-bottom: 1px solid rgba(255,255,255,0.025);
    transition: background 0.12s;
    font-size: var(--text-sm);
  }
  .prop-row:last-child { border-bottom: none; }
  .prop-row:hover { background: rgba(255,255,255,0.025); }

  .prop-cat {
    font-size: 10px; font-weight: 600;
    letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--text-muted);
    width: fit-content;
  }
  .prop-name { color: var(--text-primary); white-space: normal; word-break: break-word; line-height: 1.4; font-weight: 500; }

  /* Yang + Market — paired as INPUTS, subtle */
  .prop-prob, .prop-market { font-family: 'IBM Plex Mono', monospace; font-size: var(--text-sm); text-align: right; font-variant-numeric: tabular-nums; }
  .prop-prob { color: var(--text-primary); font-weight: 500; }
  .prop-market { color: var(--text-secondary); transition: color 0.3s; font-weight: 500; }
  .prop-market.live-updated { color: var(--edge-strong); }

  /* Edge — the ANSWER, prominent */
  .edge-cell {
    display: flex; align-items: center; justify-content: flex-end;
    font-family: 'IBM Plex Mono', monospace; font-size: var(--text-md); font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }

  /* Edge tiers — clear magnitude through hue + brightness */
  .edge-pos-4 { color: var(--edge-monster); }
  .edge-pos-3 { color: var(--edge-strong); }
  .edge-pos-2 { color: var(--edge-mild); }
  .edge-pos-1 { color: var(--edge-slight); }
  .edge-zero  { color: var(--edge-zero); }
  .edge-neg-1 { color: var(--edge-neg-1); }
  .edge-neg-2 { color: var(--edge-neg-2); }

  .hidden { display: none !important; }

  @keyframes flash { 0%{background:rgba(34, 197, 94, 0.12)} 100%{background:transparent} }
  .flash-update { animation: flash 1.2s ease-out; }

  /* MOBILE — switch prop rows to stacked card layout */
  @media (max-width: 720px) {
    header { padding: 0 14px; }
    .event-title { font-size: 16px; }
    .refresh-btn .label { display: none; }
    .live-bar { padding: 7px 14px; gap: 10px; }
    .live-calls { margin-left: 0; }
    .top-edges { margin: 12px 14px 0; }
    .top-edge-item { padding: 10px 14px; }
    .top-edge-value { font-size: var(--text-sm); }
    .controls { padding: 9px 14px; }
    .content { padding: 12px 14px 32px; gap: 10px; }
    .fight-header { padding: 12px 14px; gap: 10px; }
    .fighter-name { font-size: var(--text-sm); }
    .summary-chip { padding: 4px 8px; gap: 5px; }
    .summary-chip-label { display: inline; font-size: 9px; }
    .summary-chip-value { font-size: 12px; }
    .search-wrap input { width: 130px; }

    .prop-list-header { display: none; }
    .prop-row {
      grid-template-columns: 1fr 1fr 1fr;
      grid-template-areas:
        "cat  name name"
        "yang mkt  edge";
      gap: 8px 10px;
      padding: 11px 14px;
    }
    .prop-row > .prop-cat { grid-area: cat; align-self: center; }
    .prop-row > .prop-name { grid-area: name; align-self: center; font-size: var(--text-sm); }
    .prop-row > .prop-prob { grid-area: yang; text-align: left; }
    .prop-row > .prop-market { grid-area: mkt; text-align: left; }
    .prop-row > .edge-td { grid-area: edge; }
    .prop-row > .prop-prob::before,
    .prop-row > .prop-market::before,
    .prop-row > .edge-td::before {
      content: attr(data-label);
      display: block;
      font-size: 9px; font-weight: 600;
      letter-spacing: 0.04em; text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 3px;
    }
    .edge-cell { justify-content: flex-start; }
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="event-title">UFC 328: Chimaev vs Strickland</div>
    <div class="event-date">Edge Report · Yang's Model</div>
  </div>
  <div class="header-right">
    <button class="refresh-btn" id="refresh-btn" onclick="fetchLiveOdds()">
      <span id="refresh-icon">↻</span><span class="label">Refresh</span>
    </button>
  </div>
</header>

<div class="live-bar">
  <div class="live-status">
    <div class="live-dot" id="live-dot"></div>
    <span class="live-label" id="live-label">Not yet fetched</span>
  </div>
  <span class="live-time" id="live-time"></span>
  <span class="live-book" id="live-book"></span>
  <span class="live-calls" id="live-calls"></span>
</div>

<div class="top-edges" id="top-edges">
  <div class="top-edges-header" onclick="toggleTopEdges()">
    <span class="top-edges-title">⚡ Top Edges Across Card</span>
    <span class="top-edges-toggle">▾</span>
  </div>
  <div class="top-edges-list" id="top-edges-list"></div>
</div>

<div class="controls">
  <div class="controls-row">
    <span class="controls-label">Sort</span>
    <select id="fight-select" class="fight-select" onchange="setFightFilter(this.value)"></select>
  </div>
  <div class="divider"></div>
  <div class="controls-row">
    <button class="pill-btn filter-btn" id="filter-btn" onclick="toggleFilterPanel(event)">
      Filters <span class="filter-count" id="filter-count"></span>
      <span class="filter-caret">▾</span>
    </button>
  </div>
  <div class="divider"></div>
  <div class="search-wrap">
    <span class="search-icon">⌕</span>
    <input type="text" id="search-input" placeholder="Search…" oninput="applyFilters()">
  </div>
</div>

<div class="filter-panel" id="filter-panel" onclick="event.stopPropagation()">
  <div class="filter-section">
    <div class="filter-section-title">Edge Threshold</div>
    <label class="filter-option"><input type="radio" name="edge-filter" value="all" checked onchange="setEdgeFilter('all')"><span>All</span></label>
    <label class="filter-option"><input type="radio" name="edge-filter" value="pos" onchange="setEdgeFilter('pos')"><span>+Edge only</span></label>
    <label class="filter-option"><input type="radio" name="edge-filter" value="strong" onchange="setEdgeFilter('strong')"><span>+10% Strong</span></label>
    <label class="filter-option"><input type="radio" name="edge-filter" value="monster" onchange="setEdgeFilter('monster')"><span>+20% Monster</span></label>
  </div>
  <div class="filter-section">

// ─── LIVE ODDS ENGINE ─────────────────────────────────────────────────────────

function americanToImplied(price) {
  return price > 0
    ? (100 / (price + 100)) * 100
    : (Math.abs(price) / (Math.abs(price) + 100)) * 100;
}
const NAME_ALIASES = {
  'waldo cortes acosta': 'waldo cortesacosta',
  'baisangur susurkaev': 'baysangur susurkaev',
  'marco tulio': 'marco tulio silva',
};
function normName(n) {
  const s = n.toLowerCase().replace(/[^a-z\s]/g,'').replace(/\s+/g,' ').trim();
  return NAME_ALIASES[s] || s;
}

function namesMatch(a, b) {
  const na = normName(a), nb = normName(b);
  if (na === nb) return true;
  const wordsA = na.split(' '), wordsB = nb.split(' ');
  // last name match (min 4 chars to avoid false positives)
  const lastA = wordsA[wordsA.length-1], lastB = wordsB[wordsB.length-1];
  if (lastA === lastB && lastA.length >= 4) return true;
  // one name contains the other fully
  if (na.includes(nb) || nb.includes(na)) return true;
  return false;
}

let liveUpdatedFids = new Set();

async function fetchLiveOdds() {
  const btn = document.getElementById('refresh-btn');
  const icon = document.getElementById('refresh-icon');
  const dot = document.getElementById('live-dot');
  const label = document.getElementById('live-label');
  const timeEl = document.getElementById('live-time');
  const bookEl = document.getElementById('live-book');
  const callsEl = document.getElementById('live-calls');

  btn.classList.add('loading');
  icon.textContent = '⟳';
  icon.classList.add('spin');
  dot.className = 'live-dot fetching';
  label.textContent = 'Fetching…';

  const url = `https://api.the-odds-api.com/v4/sports/${SPORT}/odds/?apiKey=${API_KEY}&regions=us&markets=h2h,totals&oddsFormat=american&bookmakers=${BOOK}`;

  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);

    const remaining = res.headers.get('x-requests-remaining');
    const used      = res.headers.get('x-requests-used');
    if (remaining) callsEl.textContent = `API: ${remaining} calls remaining`;
    if (used)      bookEl.textContent  = `Book: ${BOOK.toUpperCase()} · ${used} used`;

    const events = await res.json();
    let updatedCount = applyLiveOdds(events);

    dot.className = 'live-dot ok';
    label.textContent = updatedCount > 0 ? `Live · ${updatedCount} rows updated` : 'Live · no matching events yet';
    timeEl.textContent = 'Updated ' + new Date().toLocaleTimeString();

  } catch(err) {
    dot.className = 'live-dot err';
    label.textContent = 'Fetch failed — ' + err.message;
    timeEl.textContent = '';
    console.error('Odds API error:', err);
  }

  btn.classList.remove('loading');
  icon.textContent = '↻';
  icon.classList.remove('spin');
}

function applyLiveOdds(events) {
  let updatedCount = 0;
 console.log(events.map(e => e.home_team + ' vs ' + e.away_team).join('\n'));
  // Build lookup: normName → {f1, f2, h2h: [{name,price}], totals: [{name,point,price}]}
  const eventMap = {};
  for (const ev of events) {
    const bk = ev.bookmakers.find(b => b.key === BOOK) || ev.bookmakers[0];
    if (!bk) continue;
    const h2h    = bk.markets.find(m => m.key === 'h2h');
    const totals = bk.markets.find(m => m.key === 'totals');
    const key = normName(ev.home_team) + '|' + normName(ev.away_team);
    eventMap[key] = { home: ev.home_team, away: ev.away_team, h2h, totals };
  }

  rows.forEach((row, i) => {
    if (!LIVE_CATS.has(row.cat)) return;

    // Find matching event
    let matchedEvent = null;
    for (const [, ev] of Object.entries(eventMap)) {
      if ((namesMatch(ev.home, row.f1) && namesMatch(ev.away, row.f2)) ||
          (namesMatch(ev.home, row.f2) && namesMatch(ev.away, row.f1))) {
        matchedEvent = ev;
        break;
      }
    }
    if (!matchedEvent) return;

    let newMarket = null;

    if (row.cat === 'Moneyline' && matchedEvent.h2h) {
      const outcome = matchedEvent.h2h.outcomes.find(o => namesMatch(o.name, row.prop));
      if (outcome) newMarket = parseFloat(americanToImplied(outcome.price).toFixed(1));
    }

    if (row.cat === 'Total Rounds' && matchedEvent.totals) {
      const isOver  = row.prop.startsWith('Over');
      const isUnder = row.prop.startsWith('Under');
      const point   = parseFloat(row.prop.replace('Over ','').replace('Under ',''));
      const outcome = matchedEvent.totals.outcomes.find(o => {
        if (Math.abs(o.point - point) > 0.1) return false;
        return (isOver && o.name === 'Over') || (isUnder && o.name === 'Under');
      });
      if (outcome) newMarket = parseFloat(americanToImplied(outcome.price).toFixed(1));
    }

    if (newMarket !== null && Math.abs(newMarket - row.market) > 0.05) {
      row.market = newMarket;
      updatedCount++;
      liveUpdatedFids.add(row.fid);

      // Update DOM cell directly
      const tr = document.getElementById(`tr-${i}`);
      if (tr) {
        const edge = row.prob !== null ? row.prob - newMarket : null;
        row.edge = edge; // update in-place so filters work correctly

        const mktTd  = tr.querySelector('.market-odds');
        const edgeTd = tr.querySelector('.edge-td');

        if (mktTd) {
          mktTd.textContent = newMarket.toFixed(1) + '%';
          mktTd.classList.add('live-updated');
          setTimeout(() => mktTd.classList.remove('live-updated'), 3000);
        }

        if (edgeTd && edge !== null) {
          const [edgeCls] = edgeStyle(edge);
          const sign = edge >= 0 ? '+' : '';
          edgeTd.innerHTML = `<div class="edge-cell ${edgeCls}">${sign}${edge.toFixed(1)}%</div>`;
        }

        tr.classList.remove('flash-update');
        void tr.offsetWidth; // force reflow
        tr.classList.add('flash-update');

        // Mark fight header as live
        const block = document.getElementById('block-' + row.fid);
        if (block && !block.querySelector('.live-badge')) {
          const hdr = block.querySelector('.fighter-name');
          if (hdr) hdr.insertAdjacentHTML('beforeend', '<span class="live-badge">Live</span>');
        }
      }
    }
  });

  // Update summary counts after all changes
  applyFilters();
  return updatedCount;
}

// ─── CORE RENDER ─────────────────────────────────────────────────────────────

const fights = {};
rows.forEach((r, idx) => {
  if (!fights[r.fid]) {
    fights[r.fid] = { fid: r.fid, f1: r.f1, f2: r.f2, indices: [], cardOrder: Object.keys(fights).length };
  }
  r.edge = (typeof r.prob === 'number' && typeof r.market === 'number') ? r.prob - r.market : null;
  fights[r.fid].indices.push(idx);
});

let activeFilter = 'all', activeCats = new Set(), activeSort = 'card', activeFight = 'all';

function edgeStyle(edge) {
  if (edge >= 20)   return ['edge-pos-4','bar-green-4'];
  if (edge >= 10)   return ['edge-pos-3','bar-green-3'];
  if (edge >= 5)    return ['edge-pos-2','bar-green-2'];
  if (edge > 0)     return ['edge-pos-1','bar-green-1'];
  if (edge === 0)   return ['edge-zero', 'bar-neutral'];
  if (edge >= -5)   return ['edge-neg-1','bar-red-1'];
  return                   ['edge-neg-2','bar-red-2'];
}

function rowPassesFilter(row) {
  const e = (typeof row.edge === 'number') ? row.edge : -Infinity;
  if (activeFilter === 'pos'     && e <= 0)  return false;
  if (activeFilter === 'strong'  && e < 10)  return false;
  if (activeFilter === 'monster' && e < 20)  return false;
  if (activeCats.size > 0 && !activeCats.has(row.cat)) return false;
  const q = document.getElementById('search-input').value.toLowerCase();
  if (q && !row.prop.toLowerCase().includes(q) && !row.f1.toLowerCase().includes(q) && !row.f2.toLowerCase().includes(q)) return false;
  return true;
}

function fightSummary(fight) {
  let maxEdge = -Infinity, posCount = 0, strongCount = 0, monsterCount = 0;
  fight.indices.forEach(i => {
    const e = rows[i].edge;
    if (typeof e !== 'number' || isNaN(e)) return;
    if (e > maxEdge) maxEdge = e;
    if (e > 0) posCount++;
    if (e >= 10) strongCount++;
    if (e >= 20) monsterCount++;
  });
  if (!isFinite(maxEdge)) maxEdge = 0;
  return { maxEdge, posCount, strongCount, monsterCount };
}

function getSortedFights() {
  const list = Object.values(fights).slice();
  if (activeSort === 'maxEdge') {
    return list.sort((a, b) => fightSummary(b).maxEdge - fightSummary(a).maxEdge);
  }
  return list.sort((a, b) => a.cardOrder - b.cardOrder);
}

function getSortedPropIndices(fight) {
  return fight.indices.slice().sort((a, b) => {
    const ea = (typeof rows[a].edge === 'number') ? rows[a].edge : -Infinity;
    const eb = (typeof rows[b].edge === 'number') ? rows[b].edge : -Infinity;
    return eb - ea;
  });
}

function setEdgeFilter(val) {
  activeFilter = val;
  applyFilters();
  updateFilterButton();
}
function toggleCat(cb) {
  if (cb.checked) activeCats.add(cb.value);
  else activeCats.delete(cb.value);
  applyFilters();
  updateFilterButton();
}
function resetFilters() {
  activeFilter = 'all';
  activeCats.clear();
  const allRadio = document.querySelector('input[name="edge-filter"][value="all"]');
  if (allRadio) allRadio.checked = true;
  document.querySelectorAll('.filter-section input[type="checkbox"]').forEach(cb => cb.checked = false);
  applyFilters();
  updateFilterButton();
}
function updateFilterButton() {
  const btn = document.getElementById('filter-btn');
  const countEl = document.getElementById('filter-count');
  if (!btn || !countEl) return;
  let count = 0;
  if (activeFilter !== 'all') count++;
  count += activeCats.size;
  btn.classList.toggle('has-active', count > 0);
  countEl.textContent = count > 0 ? count : '';
}
function toggleFilterPanel(ev) {
  if (ev) ev.stopPropagation();
  const panel = document.getElementById('filter-panel');
  const btn = document.getElementById('filter-btn');
  if (!panel || !btn) return;
  if (panel.classList.contains('open')) {
    closeFilterPanel();
    return;
  }
  const rect = btn.getBoundingClientRect();
  const panelW = 280;
  const top = rect.bottom + 6;
  let left = rect.left;
  if (left + panelW > window.innerWidth - 8) left = window.innerWidth - panelW - 8;
  if (left < 8) left = 8;
  panel.style.top = top + 'px';
  panel.style.left = left + 'px';
  panel.classList.add('open');
  btn.classList.add('open');
}
function closeFilterPanel() {
  const panel = document.getElementById('filter-panel');
  const btn = document.getElementById('filter-btn');
  if (panel) panel.classList.remove('open');
  if (btn) btn.classList.remove('open');
}
document.addEventListener('click', (e) => {
  const panel = document.getElementById('filter-panel');
  const btn = document.getElementById('filter-btn');
  if (!panel || !btn) return;
  if (panel.classList.contains('open') && !panel.contains(e.target) && !btn.contains(e.target)) {
    closeFilterPanel();
  }
});
function setFightFilter(val) {
  activeFight = val;
  const sel = document.getElementById('fight-select');
  if (sel) sel.classList.toggle('active-pin', val !== 'all');
  applyFilters();
  if (val !== 'all') {
    const block = document.getElementById('block-' + val);
    if (block) {
      block.classList.remove('collapsed');
      block.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  }
}
function populateFightSelect() {
  const sel = document.getElementById('fight-select');
  if (!sel) return;
  const opts = ['<option value="all">All Fights</option>'];
  Object.values(fights)
    .slice()
    .sort((a, b) => a.cardOrder - b.cardOrder)
    .forEach(f => {
      const label = `${f.f1} vs ${f.f2}`;
      opts.push(`<option value="${f.fid}">${label}</option>`);
    });
  sel.innerHTML = opts.join('');
  sel.value = activeFight;
}
function toggleFight(fid)     { document.getElementById('block-' + fid).classList.toggle('collapsed'); }
function toggleTopEdges()     { document.getElementById('top-edges').classList.toggle('collapsed'); }
function scrollToFight(fid) {
  const block = document.getElementById('block-' + fid);
  if (!block) return;
  block.classList.remove('collapsed');
  block.classList.remove('hidden');
  block.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function lastName(n) { const p = n.trim().split(/\s+/); return p[p.length-1]; }

function renderTopEdges() {
  const list = document.getElementById('top-edges-list');
  const top = rows
    .map((r, i) => ({ row: r, idx: i }))
    .filter(x => typeof x.row.edge === 'number' && x.row.edge > 0)
    .sort((a, b) => b.row.edge - a.row.edge)
    .slice(0, 8);
  if (top.length === 0) {
    list.innerHTML = '<div class="empty-state" style="padding:18px">No positive edges found</div>';
    return;
  }
  list.innerHTML = top.map(({row}, i) => {
    const [edgeCls] = edgeStyle(row.edge);
    return `
      <div class="top-edge-item" onclick="scrollToFight('${row.fid}')">
        <div class="top-edge-rank">#${i+1}</div>
        <div style="min-width:0">
          <div class="top-edge-prop-name">${row.prop}</div>
          <div class="top-edge-fight">${lastName(row.f1)} vs ${lastName(row.f2)} · ${row.cat}</div>
        </div>
        <div class="top-edge-value ${edgeCls}">+${row.edge.toFixed(1)}%</div>
      </div>`;
  }).join('');
}

function updateFightChips(fight) {
  const block = document.getElementById('block-' + fight.fid);
  if (!block) return;
  const sum = fightSummary(fight);
  const posEl = block.querySelector('.pos-count-value');
  if (posEl) posEl.textContent = sum.posCount;
}

function applyFilters() {
  let visibleTotal = 0, posCount = 0, strongCount = 0, monsterCount = 0;
  rows.forEach(r => {
    const e = r.edge;
    if (typeof e !== 'number' || isNaN(e)) return;
    if (e > 0) posCount++;
    if (e >= 10) strongCount++;
    if (e >= 20) monsterCount++;
  });
  Object.values(fights).forEach(fight => {
    const block = document.getElementById('block-' + fight.fid);
    const fightHiddenByFilter = activeFight !== 'all' && activeFight !== fight.fid;
    let fv = 0;
    fight.indices.forEach(i => {
      const tr = document.getElementById('tr-' + i);
      if (!tr) return;
      const pass = rowPassesFilter(rows[i]);
      tr.classList.toggle('hidden', !pass);
      if (pass) { fv++; visibleTotal++; }
    });
    if (block) block.classList.toggle('hidden', fightHiddenByFilter || fv === 0);
    updateFightChips(fight);
  });
  renderTopEdges();
}

function buildFightBlock(fight) {
  const block = document.createElement('div');
  block.className = 'fight-block';
  block.id = 'block-' + fight.fid;
  const sum = fightSummary(fight);
  block.innerHTML = `
    <div class="fight-header" onclick="toggleFight('${fight.fid}')">
      <div class="fight-matchup">
        <div class="fight-matchup-line">
          <span class="fighter-name">${fight.f1}</span>
          <span class="vs">vs</span>
          <span class="fighter-name">${fight.f2}</span>
        </div>
      </div>
      <div class="fight-summary">
        <div class="summary-chip">
          <span class="summary-chip-label">+Edges</span>
          <span class="summary-chip-value pos-count-value">${sum.posCount}</span>
        </div>
        <span class="fight-toggle">▾</span>
      </div>
    </div>
    <div class="fight-body">
      <div class="prop-list">
        <div class="prop-list-header">
          <div>Category</div>
          <div>Prop / Outcome</div>
          <div class="num">Yang</div>
          <div class="num">Market</div>
          <div class="num">Edge</div>
        </div>
        <div id="props-${fight.fid}"></div>
      </div>
    </div>`;
  return block;
}

function buildPropRow(i) {
  const row = rows[i];
  const propRow = document.createElement('div');
  propRow.className = 'prop-row';
  propRow.id = 'tr-' + i;
  const edge = (typeof row.edge === 'number') ? row.edge : 0;
  const [edgeCls] = edgeStyle(edge);
  const sign = edge >= 0 ? '+' : '';
  propRow.innerHTML = `
    <div class="prop-cat">${row.cat}</div>
    <div class="prop-name">${row.prop}</div>
    <div class="prop-prob" data-label="Yang">${row.prob.toFixed(1)}%</div>
    <div class="prop-market market-odds" data-label="Market">${row.market.toFixed(1)}%</div>
    <div class="edge-td" data-label="Edge"><div class="edge-cell ${edgeCls}">${sign}${edge.toFixed(1)}%</div></div>`;
  return propRow;
}

function render() {
  const content = document.getElementById('content');
  content.innerHTML = '';
  const sortedFights = getSortedFights();
  if (sortedFights.length === 0) {
    content.innerHTML = '<div class="empty-state">No fights to display.</div>';
    return;
  }
  sortedFights.forEach(fight => {
    const block = buildFightBlock(fight);
    content.appendChild(block);
    const propsContainer = document.getElementById('props-' + fight.fid);
    getSortedPropIndices(fight).forEach(i => propsContainer.appendChild(buildPropRow(i)));
  });
  applyFilters();
}

if (window.innerWidth <= 720) {
  document.getElementById('top-edges').classList.add('collapsed');

populateFightSelect();
render();
fetchLiveOdds(); // fetch on load
