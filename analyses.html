<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UFC Synopses — Yang's Model</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0c14;
    --surface: #11141d;
    --surface-2: #161a26;
    --surface-3: #1d2230;
    --border: #1f2434;
    --border-bright: #2c3147;
    --text-primary: #eef0f8;
    --text-secondary: #a0a6c5;
    --text-muted: #5b6088;
    --brand: #f0b429;
    --brand-soft: rgba(240, 180, 41, 0.10);
    --edge-strong: #22c55e;
    --edge-neg-2: #ef4444;
    --text-xs: 11px;
    --text-sm: 13px;
    --text-md: 15px;
    --text-lg: 18px;
    --header-h: 56px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: var(--bg); color: var(--text-primary); font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 13px; min-height: 100vh; -webkit-font-smoothing: antialiased; }
  body { padding-bottom: 80px; }

  /* HEADER */
  header { height: var(--header-h); background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; position: sticky; top: 0; z-index: 100; }
  .header-left { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .event-title { font-size: var(--text-lg); font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .event-date { font-family: 'IBM Plex Mono', monospace; font-size: var(--text-xs); color: var(--text-muted); letter-spacing: 0.02em; }

  /* NAV */
  .primary-nav { display: flex; align-items: stretch; height: 100%; gap: 4px; flex-shrink: 0; }
  .nav-tab { position: relative; display: flex; align-items: center; gap: 4px; padding: 0 14px; height: 100%; font-size: var(--text-sm); font-weight: 600; letter-spacing: 0.01em; color: var(--text-secondary); text-decoration: none; cursor: pointer; border-bottom: 2px solid transparent; transition: color 0.12s, border-color 0.12s; user-select: none; }
  .nav-tab:hover { color: var(--text-primary); }
  .nav-tab.active { color: var(--brand); border-bottom-color: var(--brand); }
  .nav-tab .caret { font-size: 9px; opacity: 0.7; }

  .nav-dropdown-menu {
    position: absolute; top: 100%; right: 0;
    min-width: 320px; max-width: 380px; max-height: 70vh;
    background: var(--surface); border: 1px solid var(--border-bright);
    border-top: none; border-radius: 0 0 6px 6px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.5);
    overflow-y: auto;
    opacity: 0; visibility: hidden; transform: translateY(-4px);
    transition: opacity 0.12s, transform 0.12s, visibility 0.12s;
    padding: 6px 0;
    z-index: 200;
  }
  .nav-dropdown:hover .nav-dropdown-menu,
  .nav-dropdown.open .nav-dropdown-menu { opacity: 1; visibility: visible; transform: translateY(0); }
  .nav-dropdown-item {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 12px;
    align-items: center;
    padding: 8px 14px;
    color: var(--text-primary);
    text-decoration: none;
    font-size: var(--text-sm);
    border-left: 2px solid transparent;
    cursor: pointer;
  }
  .nav-dropdown-item:hover { background: var(--surface-2); border-left-color: var(--brand); }
  .nav-dropdown-item .names { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .nav-dropdown-item .matchup-line { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nav-dropdown-item .meta-line { font-family: 'IBM Plex Mono', monospace; font-size: var(--text-xs); color: var(--text-muted); }
  .nav-dropdown-item .pct { font-family: 'IBM Plex Mono', monospace; font-size: var(--text-xs); color: var(--text-secondary); white-space: nowrap; }

  /* MAIN */
  main { padding: 16px; max-width: 960px; margin: 0 auto; }
  .meta-bar { font-family: 'IBM Plex Mono', monospace; font-size: var(--text-xs); color: var(--text-muted); margin-bottom: 14px; text-align: center; letter-spacing: 0.03em; }

  /* FIGHT CARD */
  .fight-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 10px; scroll-margin-top: calc(var(--header-h) + 8px); overflow: hidden; }
  .fight-card.expanded { border-color: var(--border-bright); }

  .fight-card-header {
    display: grid;
    grid-template-columns: 1fr auto auto;
    align-items: center;
    gap: 14px;
    padding: 12px 14px;
    background: transparent;
    border: none;
    text-align: left;
    width: 100%;
    cursor: pointer;
    color: inherit;
    font: inherit;
  }
  .fight-card-header:hover { background: var(--surface-2); }
  .fight-card-header .matchup { font-size: var(--text-md); font-weight: 700; letter-spacing: -0.01em; }
  .fight-card-header .matchup .vs { color: var(--text-muted); font-weight: 500; margin: 0 6px; font-size: var(--text-sm); }
  .fight-card-header .meta { font-family: 'IBM Plex Mono', monospace; font-size: var(--text-xs); color: var(--text-muted); margin-top: 2px; letter-spacing: 0.02em; }
  .fight-card-header .probs { font-family: 'IBM Plex Mono', monospace; font-size: var(--text-sm); color: var(--text-secondary); white-space: nowrap; }
  .fight-card-header .probs .fav { color: var(--text-primary); font-weight: 600; }
  .fight-card-header .expand-icon { font-size: 11px; color: var(--text-muted); transition: transform 0.18s; width: 14px; text-align: center; }
  .fight-card.expanded .expand-icon { transform: rotate(180deg); color: var(--text-secondary); }

  .fight-card-body { padding: 0 14px 16px; border-top: 1px solid var(--border); display: none; }
  .fight-card.expanded .fight-card-body { display: block; }

  /* BLOCKS */
  .block { margin-top: 14px; }
  .block-title { font-size: var(--text-xs); font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; padding-bottom: 5px; border-bottom: 1px solid var(--border); }
  .block-note { font-size: var(--text-xs); color: var(--text-muted); font-style: italic; margin-bottom: 8px; }

  .ml-row { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; padding: 8px 0; }
  .ml-row .name { font-weight: 600; }
  .ml-row .name.right { text-align: right; }
  .ml-row .pct { font-family: 'IBM Plex Mono', monospace; font-size: var(--text-md); font-weight: 700; color: var(--text-primary); }
  .ml-row .pct.right { text-align: right; }
  .ml-row .vs { color: var(--text-muted); font-size: var(--text-xs); padding: 0 8px; }

  .pbar { height: 6px; background: var(--surface-3); border-radius: 3px; overflow: hidden; display: flex; margin: 4px 0 8px; }
  .pbar .bar-f1 { background: var(--brand); }
  .pbar .bar-f2 { background: var(--text-secondary); opacity: 0.6; }

  table.stat { width: 100%; border-collapse: collapse; font-size: var(--text-sm); }
  table.stat th, table.stat td { padding: 6px 8px; text-align: right; border-bottom: 1px solid var(--border); }
  table.stat th { font-size: var(--text-xs); font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
  table.stat th:first-child, table.stat td:first-child { text-align: left; }
  table.stat td.label { color: var(--text-secondary); }
  table.stat tbody tr:last-child td { border-bottom: none; }
  table.stat .num { font-family: 'IBM Plex Mono', monospace; }
  table.stat .pos { color: var(--edge-strong); }
  table.stat .neg { color: var(--edge-neg-2); }

  .rounds-line { font-family: 'IBM Plex Mono', monospace; font-size: var(--text-xs); color: var(--text-secondary); padding-top: 8px; line-height: 1.6; }
  .rounds-line strong { color: var(--text-primary); }

  .profile-card { background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; margin-top: 8px; }
  .profile-card .pname { font-weight: 700; font-size: var(--text-md); margin-bottom: 4px; }
  .profile-card .pline { font-size: var(--text-xs); color: var(--text-secondary); line-height: 1.55; margin-top: 2px; }
  .profile-card .pline.recent { font-family: 'IBM Plex Mono', monospace; color: var(--text-muted); }

  /* JUMP BUTTONS */
  .actions { display: flex; gap: 8px; justify-content: space-between; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); }
  .actions button { background: transparent; border: 1px solid var(--border-bright); color: var(--text-secondary); padding: 6px 10px; border-radius: 4px; font-size: var(--text-xs); font-weight: 600; cursor: pointer; letter-spacing: 0.02em; }
  .actions button:hover { color: var(--text-primary); border-color: var(--text-secondary); }

  /* MOBILE */
  @media (max-width: 720px) {
    header { padding: 0 10px; }
    .event-title { font-size: 14px; }
    .nav-tab { padding: 0 10px; font-size: var(--text-xs); }
    .nav-dropdown-menu { right: 8px; min-width: 280px; max-width: calc(100vw - 16px); }
    main { padding: 12px; }
    .fight-card-header { grid-template-columns: 1fr auto; padding: 10px 12px; gap: 8px; }
    .fight-card-header .probs { grid-column: 1; grid-row: 2; font-size: var(--text-xs); }
    .fight-card-header .meta { font-size: 10px; }
    .fight-card-header .expand-icon { grid-column: 2; grid-row: 1 / span 2; }
    table.stat th, table.stat td { padding: 5px 6px; font-size: var(--text-xs); }
    .ml-row .pct { font-size: var(--text-sm); }
  }

  .loading { padding: 40px 16px; text-align: center; color: var(--text-muted); font-family: 'IBM Plex Mono', monospace; }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="event-title" id="event-title">UFC Synopses</div>
    <div class="event-date" id="event-meta">Synopses · Yang's Model</div>
  </div>
  <nav class="primary-nav">
    <a href="./" class="nav-tab">Edges</a>
    <div class="nav-tab nav-dropdown active" id="synopsis-tab" tabindex="0">
      Synopsis <span class="caret">▾</span>
      <div class="nav-dropdown-menu" id="nav-fight-list">
        <div class="loading" style="padding: 20px; font-size: 11px;">Loading…</div>
      </div>
    </div>
  </nav>
</header>

<main>
  <div id="fight-list">
    <div class="loading">Loading synopses…</div>
  </div>
</main>

<script>
const fmtPct = (n) => (n == null || isNaN(n)) ? '—' : n.toFixed(1) + '%';
const fmtSignedNum = (n) => {
  if (n == null || isNaN(n)) return '—';
  return (n >= 0 ? '+' : '') + n.toFixed(2);
};

function slugify(s) {
  return s.toLowerCase().replace(/[^\w\s-]/g,'').trim().replace(/\s+/g,'-');
}
function shortName(full) {
  const parts = full.split(/\s+/);
  return parts[parts.length - 1];
}
function escape(s) {
  return (s == null ? '' : String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderModelProjections(mp) {
  if (!mp) return '';
  const f1Fav = mp.modelProb && mp.modelProb.f1 >= mp.modelProb.f2;
  const f1P = mp.modelProb ? mp.modelProb.f1 : 50;
  const f2P = mp.modelProb ? mp.modelProb.f2 : 50;
  return `
    <div class="block">
      <div class="block-title">Model Projection</div>
      <div class="ml-row">
        <div>
          <div class="name">${escape(mp.f1Short)}</div>
          <div class="pct ${f1Fav ? 'fav' : ''}">${fmtPct(f1P)}</div>
        </div>
        <div class="vs">vs</div>
        <div style="text-align:right">
          <div class="name right">${escape(mp.f2Short)}</div>
          <div class="pct right ${!f1Fav ? 'fav' : ''}">${fmtPct(f2P)}</div>
        </div>
      </div>
      <div class="pbar">
        <div class="bar-f1" style="width:${f1P}%"></div>
        <div class="bar-f2" style="width:${f2P}%"></div>
      </div>
      <table class="stat">
        <thead><tr><th>Method</th><th>${escape(mp.f1Short)}</th><th>${escape(mp.f2Short)}</th></tr></thead>
        <tbody>
          ${mp.method.map(m => `<tr><td class="label">${escape(m.name)}</td><td class="num">${fmtPct(m.f1)}</td><td class="num">${fmtPct(m.f2)}</td></tr>`).join('')}
        </tbody>
      </table>
      ${mp.decisionPct != null || mp.roundsFinish.length ? `
        <div class="rounds-line">
          ${mp.decisionPct != null ? `Goes to decision: <strong>${fmtPct(mp.decisionPct)}</strong>` : ''}
          ${mp.roundsFinish.length ? ' · Finish by round: ' + mp.roundsFinish.map(r => `R${r.r} <strong>${fmtPct(r.pct)}</strong>`).join('  ') : ''}
        </div>
      ` : ''}
    </div>
  `;
}

function renderOverUnder(rows) {
  if (!rows || !rows.length) return '';
  return `
    <div class="block">
      <div class="block-title">Over/Under (Total Rounds)</div>
      <table class="stat">
        <thead><tr><th>Line</th><th>Under</th><th>Over</th></tr></thead>
        <tbody>
          ${rows.map(r => `<tr><td class="label">${r.line.toFixed(1)}</td><td class="num">${fmtPct(r.under)}</td><td class="num">${fmtPct(r.over)}</td></tr>`).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function colorClass(v) {
  if (v == null || isNaN(v)) return '';
  if (v > 0.001) return 'pos';
  if (v < -0.001) return 'neg';
  return '';
}

function renderComposites(comp, f1Short, f2Short) {
  if (!comp || !comp.rows || !comp.rows.length) return '';
  return `
    <div class="block">
      <div class="block-title">Composites (Z-scores vs Weight Class)</div>
      ${comp.note ? `<div class="block-note">${escape(comp.note)}</div>` : ''}
      <table class="stat">
        <thead><tr><th>Composite</th><th>${escape(f1Short)}</th><th>${escape(f2Short)}</th><th>Δ</th></tr></thead>
        <tbody>
          ${comp.rows.map(r => `
            <tr>
              <td class="label">${escape(r.name)}</td>
              <td class="num ${colorClass(r.f1)}">${fmtSignedNum(r.f1)}</td>
              <td class="num ${colorClass(r.f2)}">${fmtSignedNum(r.f2)}</td>
              <td class="num ${colorClass(r.delta)}">${fmtSignedNum(r.delta)}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function renderStyleProfiles(rows, f1Short, f2Short) {
  if (!rows || !rows.length) return '';
  return `
    <div class="block">
      <div class="block-title">Style Profiles</div>
      <table class="stat">
        <thead><tr><th>Style</th><th>${escape(f1Short)}</th><th>${escape(f2Short)}</th></tr></thead>
        <tbody>
          ${rows.map(r => `<tr><td class="label">${escape(r.name)}</td><td class="num">${r.f1.toFixed(2)}</td><td class="num">${r.f2.toFixed(2)}</td></tr>`).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function renderModifiers(rows, f1Short, f2Short) {
  if (!rows || !rows.length) return '';
  return `
    <div class="block">
      <div class="block-title">Modifiers & Trust</div>
      <table class="stat">
        <thead><tr><th>Factor</th><th>${escape(f1Short)}</th><th>${escape(f2Short)}</th></tr></thead>
        <tbody>
          ${rows.map(r => `<tr><td class="label">${escape(r.name)}</td><td class="num">${escape(r.f1)}</td><td class="num">${escape(r.f2)}</td></tr>`).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function renderMatchupEdges(rows) {
  if (!rows || !rows.length) return '';
  return `
    <div class="block">
      <div class="block-title">Matchup Edges</div>
      <table class="stat">
        <thead><tr><th>Edge</th><th>Value</th><th>Reads As</th></tr></thead>
        <tbody>
          ${rows.map(r => `<tr><td class="label">${escape(r.name)}</td><td class="num">${escape(r.value)}</td><td>${escape(r.reads)}</td></tr>`).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function renderProfiles(profiles) {
  if (!profiles || !profiles.length) return '';
  return `
    <div class="block">
      <div class="block-title">Fighter Profiles (UFC + DWCS/RTUF Only)</div>
      ${profiles.map(p => `
        <div class="profile-card">
          <div class="pname">${escape(p.name)}</div>
          ${p.lines.map(l => `<div class="pline ${/^Recent:/i.test(l) ? 'recent' : ''}">${escape(l)}</div>`).join('')}
        </div>
      `).join('')}
    </div>
  `;
}

function renderFightCard(fight, idx) {
  const id = slugify(`${fight.f1}-vs-${fight.f2}`);
  const mp = fight.sections.modelProjections;
  const f1Short = mp ? mp.f1Short : shortName(fight.f1);
  const f2Short = mp ? mp.f2Short : shortName(fight.f2);
  const f1P = mp && mp.modelProb ? mp.modelProb.f1 : null;
  const f2P = mp && mp.modelProb ? mp.modelProb.f2 : null;
  const f1Fav = f1P != null && f2P != null && f1P >= f2P;

  return `
    <div class="fight-card" id="${id}" data-idx="${idx}">
      <button class="fight-card-header" onclick="toggleFight('${id}')" aria-expanded="false">
        <div>
          <div class="matchup">${escape(fight.f1)} <span class="vs">vs</span> ${escape(fight.f2)}</div>
          <div class="meta">${fight.rounds}R · ${escape(fight.division)}${fight.dataMode ? ' · ' + escape(fight.dataMode) : ''}</div>
        </div>
        <div class="probs">
          ${f1P != null ? `<span class="${f1Fav ? 'fav' : ''}">${fmtPct(f1P)}</span> / <span class="${!f1Fav ? 'fav' : ''}">${fmtPct(f2P)}</span>` : ''}
        </div>
        <div class="expand-icon">▾</div>
      </button>
      <div class="fight-card-body">
        ${renderModelProjections(mp)}
        ${renderOverUnder(fight.sections.overUnder)}
        ${renderComposites(fight.sections.composites, f1Short, f2Short)}
        ${renderStyleProfiles(fight.sections.styleProfiles, f1Short, f2Short)}
        ${renderModifiers(fight.sections.modifiers, f1Short, f2Short)}
        ${renderMatchupEdges(fight.sections.matchupEdges)}
        ${renderProfiles(fight.sections.profiles)}
        <div class="actions">
          <button onclick="prevFight(${idx})">← Prev</button>
          <button onclick="collapseAll()">Collapse all</button>
          <button onclick="nextFight(${idx})">Next →</button>
        </div>
      </div>
    </div>
  `;
}

function toggleFight(id) {
  const el = document.getElementById(id);
  if (!el) return;
  const wasExpanded = el.classList.contains('expanded');
  el.classList.toggle('expanded');
  const btn = el.querySelector('.fight-card-header');
  if (btn) btn.setAttribute('aria-expanded', String(!wasExpanded));
  if (!wasExpanded) {
    history.replaceState(null, '', '#' + id);
  }
}
function expandFight(id) {
  const el = document.getElementById(id);
  if (!el) return;
  el.classList.add('expanded');
  const btn = el.querySelector('.fight-card-header');
  if (btn) btn.setAttribute('aria-expanded', 'true');
  el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
function collapseAll() {
  document.querySelectorAll('.fight-card.expanded').forEach(el => {
    el.classList.remove('expanded');
    const btn = el.querySelector('.fight-card-header');
    if (btn) btn.setAttribute('aria-expanded', 'false');
  });
}
function prevFight(idx) {
  const next = document.querySelector(`.fight-card[data-idx="${idx-1}"]`);
  if (next) { collapseAll(); expandFight(next.id); }
}
function nextFight(idx) {
  const next = document.querySelector(`.fight-card[data-idx="${idx+1}"]`);
  if (next) { collapseAll(); expandFight(next.id); }
}

function renderNavDropdown(fights) {
  const menu = document.getElementById('nav-fight-list');
  menu.innerHTML = fights.map(f => {
    const id = slugify(`${f.f1}-vs-${f.f2}`);
    const mp = f.sections.modelProjections;
    const f1P = mp && mp.modelProb ? mp.modelProb.f1 : null;
    const f2P = mp && mp.modelProb ? mp.modelProb.f2 : null;
    const probStr = f1P != null ? `${Math.round(f1P)}% / ${Math.round(f2P)}%` : '';
    return `<a class="nav-dropdown-item" href="#${id}" onclick="closeNavDropdown()">
      <div class="names">
        <div class="matchup-line">${escape(f.f1)} vs ${escape(f.f2)}</div>
        <div class="meta-line">${f.rounds}R · ${escape(f.division)}</div>
      </div>
      <div class="pct">${probStr}</div>
    </a>`;
  }).join('');
}

function closeNavDropdown() {
  const tab = document.getElementById('synopsis-tab');
  tab.classList.remove('open');
}

// Mobile: tap to toggle
document.addEventListener('DOMContentLoaded', () => {
  const tab = document.getElementById('synopsis-tab');
  tab.addEventListener('click', (e) => {
    if (window.matchMedia('(hover: none)').matches || window.innerWidth <= 720) {
      // tap toggles
      if (!e.target.closest('.nav-dropdown-menu')) {
        e.preventDefault();
        tab.classList.toggle('open');
      }
    }
  });
  document.addEventListener('click', (e) => {
    if (!tab.contains(e.target)) tab.classList.remove('open');
  });
});

async function loadSynopses() {
  try {
    const res = await fetch('synopses.json?_=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();

    // Header — derive event title from first cardList entry context, or fallback
    if (data.fights.length) {
      const titleEl = document.getElementById('event-title');
      // Pull event title from edge sheet's data.csv header if available, else use generic
      try {
        const csvRes = await fetch('data.csv?_=' + Date.now());
        const csv = await csvRes.text();
        const firstLine = csv.split('\n')[0].replace(/^#\s*/, '').trim();
        if (firstLine) titleEl.textContent = firstLine;
      } catch (e) { /* keep default */ }
    }
    document.getElementById('event-meta').textContent = data.generated ? data.generated.replace(/^Generated\s+/, '') : 'Synopses · Yang\'s Model';

    const list = document.getElementById('fight-list');
    list.innerHTML = data.fights.map((f, idx) => renderFightCard(f, idx)).join('');

    renderNavDropdown(data.fights);

    // Auto-expand fight if hash present
    if (location.hash) {
      const id = location.hash.slice(1);
      setTimeout(() => expandFight(id), 50);
    }
  } catch (e) {
    document.getElementById('fight-list').innerHTML = `<div class="loading">Failed to load synopses.json — ${escape(e.message)}</div>`;
  }
}

window.addEventListener('hashchange', () => {
  if (location.hash) expandFight(location.hash.slice(1));
});

loadSynopses();
</script>
</body>
</html>
