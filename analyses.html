<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UFC Synopses — Yang's Model</title>
<script>
  // Password gate — bounce to landing if not authed (client-side only, not real security)
  try { if (localStorage.getItem('yangmma_auth') !== '1') location.replace('landing.html'); } catch (e) {}
</script>
<style>
  :root {
    color-scheme: dark;
    /* iOS Dark surfaces */
    --bg: #000000;
    --surface: #1c1c1e;
    --surface-2: #2c2c2e;
    --surface-3: #3a3a3c;
    --separator: #38383a;
    --separator-strong: #545458;
    /* iOS Text */
    --text-primary: #ffffff;
    --text-secondary: #aeaeb2;
    --text-muted: #8e8e93;
    /* iOS Accents — dark mode variants */
    --brand: #0a84ff;
    --brand-soft: rgba(10, 132, 255, 0.16);
    --green: #30d158;
    --green-strong: #30d158;
    --red: #ff453a;
    --orange: #ff9f0a;
    /* Type scale */
    --text-xs: 11px;
    --text-sm: 13px;
    --text-md: 15px;
    --text-lg: 17px;
    --text-xl: 22px;
    /* Layout */
    --header-h: 56px;
    --radius: 12px;
    --radius-sm: 8px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: var(--bg);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Segoe UI', system-ui, sans-serif;
    font-size: 14px;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  body { padding-bottom: 120px; }

  /* HEADER */
  header {
    height: var(--header-h); background: var(--surface);
    border-bottom: 0.5px solid var(--separator);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 16px; position: sticky; top: 0; z-index: 100;
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    background: rgba(28,28,30,0.85);
  }
  .header-left { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .event-title { font-size: var(--text-lg); font-weight: 700; letter-spacing: -0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-primary); text-decoration: none; transition: color 0.12s; display: block; }
  a.event-title:hover { color: var(--brand); }
  .event-date { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: var(--text-xs); color: var(--text-muted); letter-spacing: 0.01em; }

  /* NAV */
  .primary-nav { display: flex; align-items: stretch; height: 100%; gap: 2px; flex-shrink: 0; }
  .nav-tab {
    position: relative; display: flex; align-items: center; gap: 4px;
    padding: 0 12px; height: 100%;
    font-size: var(--text-sm); font-weight: 600; letter-spacing: -0.01em;
    color: var(--text-secondary); text-decoration: none; cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: color 0.12s, border-color 0.12s;
    user-select: none;
  }
  .nav-tab:hover { color: var(--text-primary); }
  .nav-tab.active { color: var(--brand); border-bottom-color: var(--brand); }
  .nav-tab .caret { font-size: 9px; opacity: 0.65; }

  .nav-dropdown-menu {
    position: absolute; top: 100%; right: 0;
    min-width: 320px; max-width: 380px; max-height: 70vh;
    background: var(--surface);
    border: 1px solid var(--separator);
    border-radius: 14px;
    box-shadow: 0 14px 40px rgba(0,0,0,0.12);
    overflow-y: auto;
    opacity: 0; visibility: hidden; transform: translateY(-4px);
    transition: opacity 0.16s ease, transform 0.16s ease, visibility 0.16s;
    padding: 6px 0; margin-top: 6px;
    z-index: 200;
  }
  .nav-dropdown:hover .nav-dropdown-menu,
  .nav-dropdown.open .nav-dropdown-menu { opacity: 1; visibility: visible; transform: translateY(0); }
  .nav-dropdown-item {
    display: block;
    padding: 9px 14px;
    color: var(--text-primary); text-decoration: none;
    font-size: var(--text-sm);
    border-radius: 6px;
    margin: 0 4px;
  }
  .nav-dropdown-item:hover { background: var(--surface-3); }
  .nav-dropdown-item.current { background: var(--brand-soft); color: var(--brand); }
  .nav-dropdown-item .names { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .nav-dropdown-item .matchup-line { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nav-dropdown-item .meta-line { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: var(--text-xs); color: var(--text-muted); }
  .nav-dropdown-item.current .meta-line { color: var(--brand); opacity: 0.85; }
  .nav-dropdown-item .pct { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: var(--text-xs); color: var(--text-secondary); white-space: nowrap; }

  /* MAIN */
  main { padding: 16px; max-width: 760px; margin: 0 auto; }

  /* FIGHT NAVIGATION BAR */
  .fight-pager {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px;
    background: var(--surface);
    border-radius: var(--radius);
    padding: 8px 10px;
    margin-bottom: 14px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    border: 0.5px solid var(--separator);
  }
  .fight-pager-btn {
    background: var(--surface-3); border: none;
    color: var(--text-primary);
    font: inherit; font-weight: 600; font-size: var(--text-sm);
    padding: 8px 12px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 4px;
    transition: background 0.12s;
  }
  .fight-pager-btn:hover { background: var(--separator); }
  .fight-pager-btn:disabled { opacity: 0.35; cursor: default; }
  .fight-pager-btn:disabled:hover { background: var(--surface-3); }
  .fight-pager-current { flex: 1; text-align: center; font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: var(--text-xs); color: var(--text-muted); letter-spacing: 0.04em; }

  /* FIGHT CARD (single, expanded) */
  .fight-card {
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    border: 0.5px solid var(--separator);
    overflow: hidden;
  }
  .fight-hero {
    padding: 20px 18px 18px;
    border-bottom: 0.5px solid var(--separator);
  }
  .fight-hero .matchup {
    font-size: var(--text-xl); font-weight: 700;
    letter-spacing: -0.022em; line-height: 1.2;
  }
  .fight-hero .matchup .vs { color: var(--text-muted); font-weight: 500; margin: 0 8px; font-size: var(--text-md); }
  .fight-hero .meta {
    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    font-size: var(--text-xs); color: var(--text-muted);
    margin-top: 6px; letter-spacing: 0.02em;
  }

  .fight-card-body { padding: 4px 18px 20px; }

  /* BLOCKS */
  .block { margin-top: 18px; }
  .block-title {
    font-size: var(--text-xs); font-weight: 600;
    letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--text-muted); margin-bottom: 10px;
    padding-left: 4px;
  }
  .block-note { font-size: var(--text-xs); color: var(--text-muted); margin-bottom: 10px; padding-left: 4px; }
  .block-content {
    background: var(--surface-3);
    border-radius: var(--radius);
    padding: 12px 14px;
  }

  /* Model projection: probability bar */
  .ml-row { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: end; padding: 6px 0 10px; }
  .ml-row .col { display: flex; flex-direction: column; gap: 2px; }
  .ml-row .col.right { text-align: right; }
  .ml-row .name { font-weight: 600; font-size: var(--text-sm); color: var(--text-secondary); letter-spacing: -0.01em; }
  .ml-row .pct { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: var(--text-xl); font-weight: 700; color: var(--text-primary); letter-spacing: -0.02em; }
  .ml-row .pct.fav { color: var(--brand); }
  .ml-row .vs { color: var(--text-muted); font-size: var(--text-sm); padding: 0 6px 2px; }

  .pbar { height: 8px; background: var(--separator); border-radius: 4px; overflow: hidden; display: flex; margin: 4px 0 12px; }
  .pbar .bar-f1 { background: var(--brand); }
  .pbar .bar-f2 { background: var(--text-muted); opacity: 0.5; }

  table.stat { width: 100%; border-collapse: collapse; font-size: var(--text-sm); }
  table.stat th, table.stat td { padding: 8px 6px; text-align: right; border-bottom: 0.5px solid var(--separator); }
  table.stat th { font-size: 10px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; padding-top: 0; }
  table.stat th:first-child, table.stat td:first-child { text-align: left; }
  table.stat td.label { color: var(--text-secondary); font-weight: 500; }
  table.stat tbody tr:last-child td { border-bottom: none; }
  table.stat .num { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-variant-numeric: tabular-nums; }
  table.stat .pos { color: var(--green-strong); font-weight: 600; }
  table.stat .neg { color: var(--red); font-weight: 600; }

  .rounds-line {
    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    font-size: var(--text-xs); color: var(--text-secondary);
    margin-top: 10px; padding-top: 10px;
    border-top: 0.5px solid var(--separator);
    line-height: 1.6; letter-spacing: 0.01em;
  }
  .rounds-line strong { color: var(--text-primary); font-weight: 700; }

  /* LEAN CALLOUT — the tl;dr at the top of each fight */
  .lean-card {
    background: linear-gradient(135deg, rgba(10, 132, 255, 0.14), rgba(10, 132, 255, 0.04));
    border: 0.5px solid rgba(10, 132, 255, 0.32);
    border-radius: var(--radius);
    padding: 14px 16px 16px;
    margin-top: 14px;
    position: relative;
  }
  .lean-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.10em;
    text-transform: uppercase;
    color: var(--brand);
    margin-bottom: 4px;
  }
  .lean-headline {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--text-primary);
    margin-bottom: 10px;
    line-height: 1.2;
  }
  .lean-headline .qualifier { font-weight: 500; color: var(--text-secondary); font-size: 15px; letter-spacing: -0.01em; }
  .lean-body {
    font-size: 14px;
    line-height: 1.55;
    color: var(--text-secondary);
    letter-spacing: -0.005em;
  }

  /* MATCHUP ANALYSIS — editorial-style prose block */
  .analysis-block {
    background: var(--surface);
    border: 0.5px solid var(--separator);
    border-radius: var(--radius);
    padding: 16px 20px 18px;
    margin-top: 14px;
  }
  .analysis-title {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 14px;
    padding-bottom: 8px;
    border-bottom: 0.5px solid var(--separator);
  }
  .analysis-para {
    font-size: 14.5px;
    line-height: 1.65;
    color: var(--text-primary);
    letter-spacing: -0.003em;
    max-width: 640px;
  }
  .analysis-para + .analysis-para { margin-top: 12px; }

  /* MODEL PROJECTION — restructured */
  .proj-hero {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: end;
    gap: 14px;
    padding: 4px 4px 14px;
  }
  .proj-prob { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .proj-prob.right { align-items: flex-end; text-align: right; }
  .proj-pct {
    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    font-size: 30px; font-weight: 700;
    letter-spacing: -0.03em; line-height: 1;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
  }
  .proj-pct.fav { color: var(--brand); }
  .proj-name {
    font-size: var(--text-sm); font-weight: 600;
    color: var(--text-secondary);
    letter-spacing: -0.01em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .proj-divider {
    font-size: 10px; font-weight: 600;
    color: var(--text-muted);
    letter-spacing: 0.12em; text-transform: uppercase;
    padding-bottom: 4px;
  }
  .proj-bar { height: 8px; background: var(--separator); border-radius: 4px; overflow: hidden; display: flex; margin-bottom: 4px; }
  .proj-bar-f1 { background: var(--brand); }
  .proj-bar-f2 { background: var(--text-muted); opacity: 0.55; }

  .proj-section {
    margin-top: 16px;
    padding-top: 14px;
    border-top: 0.5px solid var(--separator);
  }
  .proj-section-title {
    font-size: 10px; font-weight: 700;
    letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 10px;
  }

  /* Method of Victory — bar+number per cell */
  .method-table { display: grid; grid-template-columns: 90px 1fr 1fr; gap: 8px 12px; align-items: center; }
  .method-th {
    font-size: 10px; font-weight: 600;
    letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--text-muted);
    padding-bottom: 4px;
  }
  .method-th.center { text-align: center; }
  .method-label {
    font-size: var(--text-xs); font-weight: 500;
    color: var(--text-secondary);
  }
  .method-cell {
    display: flex; align-items: center; gap: 8px;
  }
  .method-bar-wrap {
    flex: 1; height: 8px;
    background: var(--surface);
    border: 0.5px solid var(--separator);
    border-radius: 2px;
    overflow: hidden;
  }
  .method-bar { height: 100%; border-radius: 1px; }
  .method-bar.ko { background: var(--red); }
  .method-bar.sub { background: #bf5af2; }
  .method-bar.dec { background: var(--brand); }
  .method-val {
    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    font-size: 11px; font-weight: 600;
    color: var(--text-primary);
    font-variant-numeric: tabular-nums;
    min-width: 36px;
    text-align: right;
  }

  /* Distance: stacked bar + round histogram */
  .distance-bar {
    display: flex;
    height: 26px;
    border-radius: 6px;
    overflow: hidden;
    background: var(--surface);
    border: 0.5px solid var(--separator);
    margin-bottom: 12px;
  }
  .distance-seg {
    display: flex; align-items: center; gap: 5px;
    padding: 0 10px;
    font-size: var(--text-xs); font-weight: 600;
    color: #ffffff;
    white-space: nowrap;
  }
  .distance-seg.itd { background: var(--brand); }
  .distance-seg.dec { background: var(--orange); }
  .distance-seg .seg-pct { opacity: 0.95; font-family: ui-monospace, 'SF Mono', Menlo, monospace; }

  .rounds-histo { display: flex; flex-direction: column; gap: 5px; }
  .round-row {
    display: grid;
    grid-template-columns: 24px 1fr 44px;
    gap: 10px;
    align-items: center;
    font-size: 11px;
  }
  .round-label {
    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    font-weight: 700; color: var(--text-secondary);
  }
  .round-bar-wrap {
    height: 8px;
    background: var(--surface);
    border: 0.5px solid var(--separator);
    border-radius: 2px;
    overflow: hidden;
  }
  .round-bar-fill { background: var(--brand); height: 100%; opacity: 0.8; border-radius: 1px; }
  .round-pct {
    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    text-align: right;
    color: var(--text-primary);
  }

  /* Total Rounds (Over/Under) */
  .ou-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 8px;
  }
  .ou-card {
    background: var(--surface);
    border: 0.5px solid var(--separator);
    border-radius: 6px;
    padding: 8px 10px;
    text-align: center;
  }
  .ou-line {
    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    font-size: var(--text-xs); font-weight: 700;
    color: var(--text-muted);
    letter-spacing: 0.04em;
    margin-bottom: 4px;
  }
  .ou-split { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: var(--separator); margin-bottom: 4px; }
  .ou-split .under { background: var(--brand); }
  .ou-split .over { background: var(--orange); }
  .ou-stats {
    display: flex; justify-content: space-between;
    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    font-size: 10.5px;
    font-variant-numeric: tabular-nums;
  }
  .ou-stats .u { color: var(--brand); font-weight: 600; }
  .ou-stats .o { color: var(--orange); font-weight: 600; }

  /* Profiles */
  .profile-card {
    background: var(--surface);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    border: 0.5px solid var(--separator);
  }
  .profile-card + .profile-card { margin-top: 10px; }
  .profile-card .pname { font-weight: 700; font-size: var(--text-md); letter-spacing: -0.01em; margin-bottom: 6px; }
  .profile-card .pline { font-size: var(--text-sm); color: var(--text-secondary); line-height: 1.5; margin-top: 4px; }
  .profile-card .pline.recent { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: var(--text-xs); color: var(--text-muted); }
  .profile-card .recent-label { font-size: 10px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-muted); margin-top: 8px; margin-bottom: 6px; }
  .recent-chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .recent-chip {
    display: inline-flex; align-items: center; gap: 4px;
    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    font-size: 10.5px; font-weight: 600;
    padding: 3px 8px; border-radius: 6px;
    letter-spacing: 0.01em;
    border: 0.5px solid transparent;
    white-space: nowrap;
  }
  .recent-chip.win { background: rgba(52, 199, 89, 0.14); color: var(--green-strong); border-color: rgba(52, 199, 89, 0.30); }
  .recent-chip.loss { background: rgba(255, 59, 48, 0.10); color: var(--red); border-color: rgba(255, 59, 48, 0.28); }
  .recent-chip.draw { background: var(--surface-3); color: var(--text-muted); border-color: var(--separator); }
  .recent-chip .vs-name { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif; font-weight: 500; opacity: 0.85; }

  /* PROP EDGES — top-bets card grid for the current fight */
  .prop-edges-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 8px;
  }
  .prop-edge-card {
    background: var(--surface);
    border: 0.5px solid var(--separator);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    display: flex; flex-direction: column;
  }
  .prop-edge-cat {
    font-size: 9px; font-weight: 700;
    letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--brand);
    background: var(--brand-soft);
    padding: 1px 6px;
    border-radius: 4px;
    align-self: flex-start;
    margin-bottom: 5px;
  }
  .prop-edge-name {
    font-size: var(--text-sm); font-weight: 600;
    line-height: 1.3; letter-spacing: -0.01em;
    margin-bottom: 6px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
    min-height: 34px;
  }
  .prop-edge-bar { height: 5px; background: var(--surface-3); border-radius: 3px; overflow: hidden; margin-bottom: 6px; }
  .prop-edge-bar-fill { height: 100%; border-radius: 3px; }
  .prop-edge-bar-fill.tier-3 { background: var(--green-strong); }
  .prop-edge-bar-fill.tier-2 { background: var(--green); }
  .prop-edge-bar-fill.tier-1 { background: #5cc46d; }
  .prop-edge-bar-fill.tier-neg-2 { background: var(--red); }
  .prop-edge-bar-fill.tier-neg-1 { background: #ffb1a8; }
  .prop-edge-stats { display: flex; justify-content: space-between; align-items: baseline; margin-top: auto; }
  .prop-edge-probs {
    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    font-size: 10.5px; color: var(--text-muted);
  }
  .prop-edge-probs strong { color: var(--text-primary); font-weight: 600; }
  .prop-edge-value {
    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    font-size: 17px; font-weight: 700;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
  }
  .prop-edge-value.tier-3 { color: var(--green-strong); }
  .prop-edge-value.tier-2 { color: var(--green); }
  .prop-edge-value.tier-1 { color: #5cc46d; }
  .prop-edge-value.tier-neg-2 { color: var(--red); }
  .prop-edge-value.tier-neg-1 { color: #b87a73; }
  .prop-edges-empty { padding: 14px; text-align: center; color: var(--text-muted); font-size: var(--text-xs); }

  /* COMPOSITES BAR-PAIR (diverging from center, signed z) */
  .composites-list { display: flex; flex-direction: column; gap: 10px; }
  .comp-row {
    display: grid;
    grid-template-columns: 90px 1fr 1fr 50px;
    gap: 10px;
    align-items: center;
    font-size: var(--text-xs);
  }
  .comp-label { color: var(--text-secondary); font-weight: 500; }
  .comp-axis {
    position: relative;
    height: 14px;
    background: linear-gradient(to right, transparent calc(50% - 0.5px), var(--separator-strong) calc(50% - 0.5px), var(--separator-strong) calc(50% + 0.5px), transparent calc(50% + 0.5px));
  }
  .comp-bar {
    position: absolute; top: 3px; height: 8px;
    border-radius: 2px;
  }
  .comp-bar.pos { background: var(--green); left: 50%; }
  .comp-bar.neg { background: var(--red); right: 50%; }
  .comp-val {
    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    font-variant-numeric: tabular-nums;
    text-align: right;
    color: var(--text-primary);
    font-weight: 600;
    font-size: 11px;
  }
  .comp-delta {
    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    font-variant-numeric: tabular-nums;
    text-align: right;
    font-weight: 700;
    font-size: var(--text-xs);
  }
  .comp-delta.pos { color: var(--green-strong); }
  .comp-delta.neg { color: var(--red); }
  .comp-header {
    display: grid;
    grid-template-columns: 90px 1fr 1fr 50px;
    gap: 10px;
    font-size: 10px; font-weight: 600;
    letter-spacing: 0.06em; text-transform: uppercase;

    margin-bottom: 6px;
    padding-bottom: 6px;
    border-bottom: 0.5px solid var(--separator);
  }
  .comp-header div:nth-child(2), .comp-header div:nth-child(3) { text-align: center; }
  .comp-header div:last-child { text-align: right; }

  /* STYLE PROFILES — side-by-side bars (0–1 values, no center) */
  .style-list { display: flex; flex-direction: column; gap: 9px; }
  .style-row {
    display: grid;
    grid-template-columns: 110px 1fr 32px 1fr 32px;
    gap: 8px;
    align-items: center;
    font-size: var(--text-xs);
  }
  .style-label { color: var(--text-secondary); font-weight: 500; }
  .style-bar-wrap { height: 8px; background: var(--surface); border-radius: 2px; overflow: hidden; border: 0.5px solid var(--separator); }
  .style-bar-wrap.right { display: flex; justify-content: flex-end; }
  .style-bar { height: 100%; border-radius: 1px; }
  .style-bar.f1 { background: var(--brand); }
  .style-bar.f2 { background: var(--text-muted); }
  .style-val {
    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    font-variant-numeric: tabular-nums;
    font-size: 10.5px;
    color: var(--text-primary);
    font-weight: 600;
  }
  .style-val.left { text-align: right; }
  .style-val.right { text-align: left; }
  .style-header {
    display: grid;
    grid-template-columns: 110px 1fr auto 1fr;
    gap: 8px;
    font-size: 10px; font-weight: 600;
    letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 8px;
    padding-bottom: 6px;
    border-bottom: 0.5px solid var(--separator);
  }
  .style-header .l { text-align: right; }
  .style-header .r { text-align: left; }
  .style-header .c { padding: 0 4px; }

  /* TECHNICAL EXPANDER */
  .technical {
    margin-top: 18px;
    background: var(--surface);
    border-radius: var(--radius);
    border: 0.5px solid var(--separator);
    overflow: hidden;
  }
  .technical-header {
    padding: 12px 14px;
    background: var(--surface);
    border: none;
    width: 100%; text-align: left;
    cursor: pointer;
    font: inherit;
    color: var(--text-primary);
    display: flex; align-items: center; justify-content: space-between;
    font-size: var(--text-xs); font-weight: 700;
    letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--text-muted);
  }
  .technical-header:hover { background: var(--surface-3); }
  .technical-header .caret { font-size: 11px; transition: transform 0.2s; }
  .technical.open .technical-header .caret { transform: rotate(180deg); }
  .technical-body { display: none; padding: 4px 14px 14px; }
  .technical.open .technical-body { display: block; }

  /* Mobile */
  @media (max-width: 720px) {
    header { padding: 0 12px; }
    .event-title { font-size: 15px; }
    .nav-tab { padding: 0 10px; font-size: var(--text-xs); }
    .nav-dropdown-menu { right: 8px; min-width: 280px; max-width: calc(100vw - 16px); }
    main { padding: 12px; }
    .fight-hero { padding: 16px 14px 14px; }
    .fight-hero .matchup { font-size: 18px; }
    .fight-hero .matchup .vs { display: block; margin: 4px 0; font-size: 12px; }
    .fight-card-body { padding: 4px 14px 16px; }
    .block-content { padding: 10px 12px; }
    .ml-row .pct { font-size: 18px; }
    table.stat th, table.stat td { padding: 7px 4px; font-size: var(--text-xs); }
    .fight-pager-btn { padding: 7px 10px; font-size: var(--text-xs); }
    .prop-edges-grid { grid-template-columns: 1fr; gap: 6px; }
    .comp-row { grid-template-columns: 80px 1fr 1fr 44px; gap: 8px; font-size: 10.5px; }
    .comp-header { grid-template-columns: 80px 1fr 1fr 44px; gap: 8px; }
    .style-row { grid-template-columns: 90px 1fr 28px 1fr 28px; gap: 6px; }
    .style-header { grid-template-columns: 90px 1fr auto 1fr; gap: 6px; }
    .recent-chip { font-size: 9.5px; padding: 2px 6px; }
    .recent-chip .vs-name { display: none; }
    .lean-headline { font-size: 19px; }
    .lean-headline .qualifier { font-size: 13px; }
    .lean-body { font-size: 13.5px; }
    .analysis-block { padding: 14px 16px 16px; }
    .analysis-para { font-size: 13.5px; line-height: 1.6; }
    .proj-pct { font-size: 26px; }
    .method-table { grid-template-columns: 76px 1fr 1fr; gap: 6px 8px; }
    .method-val { font-size: 10.5px; min-width: 32px; }
    .ou-grid { grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); }
  }

  .loading { padding: 60px 16px; text-align: center; color: var(--text-muted); font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: var(--text-sm); }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <a class="event-title" href="./" id="event-title" title="Home">UFC Synopses</a>
    <div class="event-date" id="event-meta">Synopses · Yang's Model</div>
  </div>
  <nav class="primary-nav">
    <a href="./" class="nav-tab">Edges</a>
    <div class="nav-tab nav-dropdown active" id="synopsis-tab" tabindex="0">
      Synopsis <span class="caret">▾</span>
      <div class="nav-dropdown-menu" id="nav-fight-list">
        <div class="loading" style="padding: 20px; font-size: 11px;">Loading…</div>
      </div>
    </div>
  </nav>
</header>

<main>
  <div id="fight-content">
    <div class="loading">Loading synopses…</div>
  </div>
</main>

<script>
const fmtPct = (n) => (n == null || isNaN(n)) ? '—' : n.toFixed(1) + '%';
const fmtSignedNum = (n) => {
  if (n == null || isNaN(n)) return '—';
  return (n >= 0 ? '+' : '') + n.toFixed(2);
};

function slugify(s) {
  return s.toLowerCase().replace(/[^\w\s-]/g,'').trim().replace(/\s+/g,'-');
}
function shortName(full) {
  const parts = full.split(/\s+/);
  return parts[parts.length - 1];
}
function escape(s) {
  return (s == null ? '' : String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

let SYNOPSES = null;
let PROP_EDGES = null;  // Map: lowercased "f1 vs f2" or "f2 vs f1" → [{cat, prop, prob, market, edge}, …]

function normKey(a, b) {
  return [a, b].map(s => s.toLowerCase().trim()).sort().join('::');
}
function parseCSVLine(line) {
  const out = [];
  let cur = '', q = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') {
      if (q && line[i+1] === '"') { cur += '"'; i++; }
      else q = !q;
    } else if (c === ',' && !q) { out.push(cur); cur = ''; }
    else cur += c;
  }
  out.push(cur);
  return out;
}
function parseDataCsv(text) {
  // Strip BOM
  text = text.replace(/^﻿/, '');
  const lines = text.split(/\r?\n/).filter(Boolean);
  // First line may be "# Event Title"
  let i = 0;
  if (lines[i].startsWith('#')) i++;
  // Header row
  const headers = parseCSVLine(lines[i++]).map(h => h.replace(/^﻿/, '').trim().toLowerCase());
  // Per-field accepted header names (first match wins). Avoids JS-object
  // duplicate-key collisions (e.g. "market" → cat vs. "market" → market).
  const HEADERS = {
    fid:    ['fightid', 'fid', 'fight id', 'fight_id'],
    cat:    ['market', 'cat', 'category'],
    prop:   ['selection', 'prop'],
    prob:   ['yang probability', 'prob', 'model_prob', 'model prob', 'yang prob'],
    market: ['market probability', 'market_prob', 'market prob'],
    f1:     ['f1', 'fighter 1', 'fighter1'],
    f2:     ['f2', 'fighter 2', 'fighter2']
  };
  const colIdx = {};
  for (const field of Object.keys(HEADERS)) {
    for (const name of HEADERS[field]) {
      const j = headers.indexOf(name);
      if (j >= 0) { colIdx[field] = j; break; }
    }
  }
  const stripPct = v => v == null ? null : parseFloat(String(v).replace(/%/g, '').trim());
  const parsed = [];
  for (; i < lines.length; i++) {
    const cells = parseCSVLine(lines[i]);
    parsed.push({
      fid: cells[colIdx.fid] || '',
      f1: colIdx.f1 != null ? cells[colIdx.f1] : '',
      f2: colIdx.f2 != null ? cells[colIdx.f2] : '',
      cat: cells[colIdx.cat] || '',
      prop: cells[colIdx.prop] || '',
      prob: stripPct(cells[colIdx.prob]),
      market: stripPct(cells[colIdx.market])
    });
  }
  // Derive f1/f2 per FightID from its two Moneyline rows when missing
  const fightFighters = {};
  for (const r of parsed) {
    if (r.cat === 'Moneyline' && r.prop) {
      if (!fightFighters[r.fid]) fightFighters[r.fid] = [];
      if (fightFighters[r.fid].length < 2 && !fightFighters[r.fid].includes(r.prop)) fightFighters[r.fid].push(r.prop);
    }
  }
  // Group rows by fid + compute edges, keyed by normalized "f1 vs f2"
  const byFight = {};
  for (const r of parsed) {
    const fs = fightFighters[r.fid] || [r.f1, r.f2].filter(Boolean);
    if (fs.length < 2) continue;
    const key = normKey(fs[0], fs[1]);
    if (!byFight[key]) byFight[key] = [];
    const edge = (r.prob != null && r.market != null) ? r.prob - r.market : null;
    byFight[key].push({ cat: r.cat, prop: r.prop, prob: r.prob, market: r.market, edge });
  }
  return byFight;
}

function renderLean(synopsis) {
  if (!synopsis || (!synopsis.lean && !synopsis.body)) return '';
  // Lean text often has a qualifier after the fighter name, separated by a comma.
  // e.g. "Tokkos, submission modal" → bold "Tokkos", muted ", submission modal"
  let headline = '';
  if (synopsis.lean) {
    const idx = synopsis.lean.indexOf(',');
    const name = idx >= 0 ? synopsis.lean.slice(0, idx).trim() : synopsis.lean.trim();
    const qual = idx >= 0 ? synopsis.lean.slice(idx).trim() : '';
    headline = `<div class="lean-headline">${escape(name)}${qual ? ` <span class="qualifier">${escape(qual)}</span>` : ''}</div>`;
  }
  return `
    <div class="lean-card">
      <div class="lean-label">Lean</div>
      ${headline}
      ${synopsis.body ? `<div class="lean-body">${escape(synopsis.body)}</div>` : ''}
    </div>
  `;
}

function renderMatchupAnalysis(paras) {
  if (!paras || !paras.length) return '';
  return `
    <div class="analysis-block">
      <div class="analysis-title">Matchup Analysis</div>
      ${paras.map(p => `<div class="analysis-para">${escape(p)}</div>`).join('')}
    </div>
  `;
}

function methodBarClass(name) {
  const n = (name || '').toLowerCase();
  if (n.includes('ko') || n.includes('tko')) return 'ko';
  if (n.includes('sub')) return 'sub';
  if (n.includes('dec')) return 'dec';
  return 'dec';
}

function renderModelProjections(mp, overUnder) {
  if (!mp) return '';
  const f1Fav = mp.modelProb && mp.modelProb.f1 >= mp.modelProb.f2;
  const f1P = mp.modelProb ? mp.modelProb.f1 : 50;
  const f2P = mp.modelProb ? mp.modelProb.f2 : 50;

  // Scale all method bars against the largest single-method value (across both fighters)
  const maxMethod = mp.method.length ? Math.max(...mp.method.flatMap(m => [m.f1, m.f2])) : 100;
  const methodScale = (v) => Math.min(100, (v / Math.max(maxMethod, 0.01)) * 100);

  const itdPct = mp.decisionPct != null ? Math.max(0, 100 - mp.decisionPct) : null;
  const maxRound = mp.roundsFinish.length ? Math.max(...mp.roundsFinish.map(r => r.pct)) : 0;

  return `
    <div class="block">
      <div class="block-title">Model Projection</div>
      <div class="block-content">
        <div class="proj-hero">
          <div class="proj-prob">
            <div class="proj-pct ${f1Fav ? 'fav' : ''}">${fmtPct(f1P)}</div>
            <div class="proj-name">${escape(mp.f1Short)}</div>
          </div>
          <div class="proj-divider">vs</div>
          <div class="proj-prob right">
            <div class="proj-pct ${!f1Fav ? 'fav' : ''}">${fmtPct(f2P)}</div>
            <div class="proj-name">${escape(mp.f2Short)}</div>
          </div>
        </div>
        <div class="proj-bar">
          <div class="proj-bar-f1" style="width:${f1P}%"></div>
          <div class="proj-bar-f2" style="width:${f2P}%"></div>
        </div>

        ${mp.method.length ? `
          <div class="proj-section">
            <div class="proj-section-title">Method of Victory</div>
            <div class="method-table">
              <div></div>
              <div class="method-th center">${escape(mp.f1Short)}</div>
              <div class="method-th center">${escape(mp.f2Short)}</div>
              ${mp.method.map(m => {
                const cls = methodBarClass(m.name);
                const label = m.name.replace(/^.+by\s+/i, '');
                return `
                  <div class="method-label">${escape(label)}</div>
                  <div class="method-cell">
                    <div class="method-bar-wrap"><div class="method-bar ${cls}" style="width:${methodScale(m.f1)}%"></div></div>
                    <div class="method-val">${fmtPct(m.f1)}</div>
                  </div>
                  <div class="method-cell">
                    <div class="method-bar-wrap"><div class="method-bar ${cls}" style="width:${methodScale(m.f2)}%"></div></div>
                    <div class="method-val">${fmtPct(m.f2)}</div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        ` : ''}

        ${mp.decisionPct != null || mp.roundsFinish.length ? `
          <div class="proj-section">
            <div class="proj-section-title">Fight Distance</div>
            ${mp.decisionPct != null ? `
              <div class="distance-bar">
                <div class="distance-seg dec" style="width:${mp.decisionPct}%">Goes the Distance <span class="seg-pct">${fmtPct(mp.decisionPct)}</span></div>
                <div class="distance-seg itd" style="width:${itdPct}%">Inside <span class="seg-pct">${fmtPct(itdPct)}</span></div>
              </div>
            ` : ''}
            ${mp.roundsFinish.length ? `
              <div class="rounds-histo">
                ${mp.roundsFinish.map(r => `
                  <div class="round-row">
                    <div class="round-label">R${r.r}</div>
                    <div class="round-bar-wrap"><div class="round-bar-fill" style="width:${maxRound > 0 ? (r.pct / maxRound * 100) : 0}%"></div></div>
                    <div class="round-pct">${fmtPct(r.pct)}</div>
                  </div>
                `).join('')}
              </div>
            ` : ''}
          </div>
        ` : ''}

        ${overUnder && overUnder.length ? `
          <div class="proj-section">
            <div class="proj-section-title">Total Rounds (Over / Under)</div>
            <div class="ou-grid">
              ${overUnder.map(r => `
                <div class="ou-card">
                  <div class="ou-line">${r.line.toFixed(1)}</div>
                  <div class="ou-split">
                    <div class="over" style="width:${r.over}%"></div>
                    <div class="under" style="width:${r.under}%"></div>
                  </div>
                  <div class="ou-stats">
                    <span class="o">O ${fmtPct(r.over)}</span>
                    <span class="u">U ${fmtPct(r.under)}</span>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        ` : ''}
      </div>
    </div>
  `;
}

function colorClass(v) {
  if (v == null || isNaN(v)) return '';
  if (v > 0.001) return 'pos';
  if (v < -0.001) return 'neg';
  return '';
}

function renderComposites(comp, f1Short, f2Short) {
  if (!comp || !comp.rows || !comp.rows.length) return '';
  // Each row: diverging-from-center bar for each fighter; bar length proportional to |z|, cap at 2.
  const MAX_Z = 2;
  const halfWidth = v => Math.min(Math.abs(v || 0) / MAX_Z, 1) * 50; // % of column width
  return `
    <div class="block">
      <div class="block-title">Composites — Z-scores vs Weight Class</div>
      ${comp.note ? `<div class="block-note">${escape(comp.note)}</div>` : ''}
      <div class="block-content">
        <div class="comp-header">
          <div></div>
          <div>${escape(f1Short)}</div>
          <div>${escape(f2Short)}</div>
          <div>Δ</div>
        </div>
        <div class="composites-list">
          ${comp.rows.map(r => `
            <div class="comp-row">
              <div class="comp-label">${escape(r.name)}</div>
              <div class="comp-axis">
                <div class="comp-bar ${r.f1 >= 0 ? 'pos' : 'neg'}" style="width:${halfWidth(r.f1)}%"></div>
              </div>
              <div class="comp-axis">
                <div class="comp-bar ${r.f2 >= 0 ? 'pos' : 'neg'}" style="width:${halfWidth(r.f2)}%"></div>
              </div>
              <div class="comp-delta ${colorClass(r.delta)}">${fmtSignedNum(r.delta)}</div>
            </div>
          `).join('')}
        </div>
      </div>
    </div>
  `;
}

function renderStyleProfiles(rows, f1Short, f2Short) {
  if (!rows || !rows.length) return '';
  return `
    <div class="block">
      <div class="block-title">Style Profiles</div>
      <div class="block-content">
        <div class="style-header">
          <div></div>
          <div class="l">${escape(f1Short)}</div>
          <div class="c">Style</div>
          <div class="r">${escape(f2Short)}</div>
        </div>
        <div class="style-list">
          ${rows.map(r => {
            // Bars 0..1 scaled to full width
            const w1 = Math.max(0, Math.min(1, r.f1)) * 100;
            const w2 = Math.max(0, Math.min(1, r.f2)) * 100;
            return `
              <div class="style-row">
                <div class="style-label">${escape(r.name)}</div>
                <div class="style-bar-wrap right"><div class="style-bar f1" style="width:${w1}%"></div></div>
                <div class="style-val left">${r.f1.toFixed(2)}</div>
                <div class="style-bar-wrap"><div class="style-bar f2" style="width:${w2}%"></div></div>
                <div class="style-val right">${r.f2.toFixed(2)}</div>
              </div>
            `;
          }).join('')}
        </div>
      </div>
    </div>
  `;
}

function propEdgeTier(edge) {
  if (edge == null || isNaN(edge)) return '';
  if (edge >= 20) return 'tier-3';
  if (edge >= 10) return 'tier-2';
  if (edge >= 0)  return 'tier-1';
  if (edge >= -10) return 'tier-neg-1';
  return 'tier-neg-2';
}

function renderPropEdges(fight) {
  if (!PROP_EDGES) return '';
  const key = normKey(fight.f1, fight.f2);
  let edges = PROP_EDGES[key];
  if (!edges) {
    // Try matching by last names too — Yang's CSV sometimes uses different forms than synopses
    const keyShort = normKey(shortName(fight.f1), shortName(fight.f2));
    for (const k of Object.keys(PROP_EDGES)) {
      const parts = k.split('::');
      const altShort = normKey(shortName(parts[0]), shortName(parts[1]));
      if (altShort === keyShort) { edges = PROP_EDGES[k]; break; }
    }
  }
  if (!edges || !edges.length) {
    return `<div class="block">
      <div class="block-title">Prop Edges (Yang vs Market)</div>
      <div class="prop-edges-empty">No prop edges available for this fight in data.csv.</div>
    </div>`;
  }
  // Top positive edges only (largest first, max 6)
  const top = edges
    .filter(e => typeof e.edge === 'number' && !isNaN(e.edge) && e.edge > 0)
    .sort((a, b) => b.edge - a.edge)
    .slice(0, 6);
  if (!top.length) {
    return `<div class="block">
      <div class="block-title">Prop Edges (Yang vs Market)</div>
      <div class="prop-edges-empty">No positive edges for this fight.</div>
    </div>`;
  }
  return `
    <div class="block">
      <div class="block-title">Prop Edges (Yang vs Market)</div>
      <div class="prop-edges-grid">
        ${top.map(e => {
          const tier = propEdgeTier(e.edge);
          const barWidth = Math.min(Math.max(e.edge, 0) / 25 * 100, 100);
          const sign = e.edge >= 0 ? '+' : '';
          return `
            <div class="prop-edge-card">
              <div class="prop-edge-cat">${escape(e.cat)}</div>
              <div class="prop-edge-name">${escape(e.prop)}</div>
              <div class="prop-edge-bar"><div class="prop-edge-bar-fill ${tier}" style="width:${barWidth}%"></div></div>
              <div class="prop-edge-stats">
                <div class="prop-edge-probs"><strong>${fmtPct(e.prob)}</strong> / ${fmtPct(e.market)}</div>
                <div class="prop-edge-value ${tier}">${sign}${e.edge.toFixed(1)}%</div>
              </div>
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `;
}

function renderModifiers(rows, f1Short, f2Short) {
  if (!rows || !rows.length) return '';
  return `
    <div class="block">
      <div class="block-title">Modifiers & Trust</div>
      <div class="block-content">
        <table class="stat">
          <thead><tr><th>Factor</th><th>${escape(f1Short)}</th><th>${escape(f2Short)}</th></tr></thead>
          <tbody>
            ${rows.map(r => `<tr><td class="label">${escape(r.name)}</td><td class="num">${escape(r.f1)}</td><td class="num">${escape(r.f2)}</td></tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

function renderMatchupEdges(rows) {
  if (!rows || !rows.length) return '';
  // Filter out GBM P line per user preference
  const filtered = rows.filter(r => !/^GBM P\(/.test(r.name));
  if (!filtered.length) return '';
  return `
    <div class="block">
      <div class="block-title">Matchup Edges</div>
      <div class="block-content">
        <table class="stat">
          <thead><tr><th>Edge</th><th>Value</th><th>Reads As</th></tr></thead>
          <tbody>
            ${filtered.map(r => `<tr><td class="label">${escape(r.name)}</td><td class="num">${escape(r.value)}</td><td>${escape(r.reads)}</td></tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

function methodAbbr(method) {
  if (!method) return '';
  const m = method.toUpperCase();
  if (m.includes('KO') || m.includes('TKO')) return 'KO';
  if (m.includes('SUB')) return 'SUB';
  if (m.includes('DEC')) return 'DEC';
  if (m.includes('DQ')) return 'DQ';
  if (m.includes('NC')) return 'NC';
  return method.slice(0, 4).toUpperCase();
}

function parseRecentChips(recentLine) {
  // "Recent: W vs Dan Ige (KO/TKO R1, 2026-02-21) | W vs Morgan Charriere (KO/TKO R1, 2025-12-13) | …"
  const stripped = recentLine.replace(/^Recent:\s*/i, '').trim();
  if (!stripped) return [];
  return stripped.split('|').map(part => {
    const m = part.trim().match(/^([WLDN]C?)\s+vs\s+(.+?)\s+\(([^,]+?)\s+(R\d+|N\/A|None)(?:,\s*([^\)]+))?\)$/i);
    if (!m) return null;
    return { result: m[1].toUpperCase(), opponent: m[2].trim(), method: m[3].trim(), round: m[4].trim(), date: m[5] ? m[5].trim() : '' };
  }).filter(Boolean);
}

function renderProfiles(profiles) {
  if (!profiles || !profiles.length) return '';
  return `
    <div class="block">
      <div class="block-title">Fighter Profiles</div>
      ${profiles.map(p => {
        const lines = p.lines || [];
        const recentLine = lines.find(l => /^Recent:/i.test(l));
        const otherLines = lines.filter(l => !/^Recent:/i.test(l));
        const chips = recentLine ? parseRecentChips(recentLine) : [];
        return `
          <div class="profile-card">
            <div class="pname">${escape(p.name)}</div>
            ${otherLines.map(l => `<div class="pline">${escape(l)}</div>`).join('')}
            ${chips.length ? `
              <div class="recent-label">Recent</div>
              <div class="recent-chips">
                ${chips.map(c => {
                  const cls = c.result === 'W' ? 'win' : (c.result === 'L' ? 'loss' : 'draw');
                  const title = `${c.result} vs ${c.opponent} — ${c.method} ${c.round}${c.date ? ' · ' + c.date : ''}`;
                  return `<span class="recent-chip ${cls}" title="${escape(title)}">
                    ${c.result} ${methodAbbr(c.method)} ${c.round}
                    <span class="vs-name">${escape(c.opponent)}</span>
                  </span>`;
                }).join('')}
              </div>
            ` : (recentLine ? `<div class="pline recent">${escape(recentLine)}</div>` : '')}
          </div>
        `;
      }).join('')}
    </div>
  `;
}

function renderTechnical(fight, f1Short, f2Short) {
  const mods = fight.sections.modifiers;
  if (!mods || !mods.length) return '';
  return `
    <div class="technical" id="technical-${slugify(`${fight.f1}-vs-${fight.f2}`)}">
      <button class="technical-header" onclick="toggleTechnical(this)">
        <span>Technical Details</span>
        <span class="caret">▾</span>
      </button>
      <div class="technical-body">
        ${renderModifiers(mods, f1Short, f2Short)}
      </div>
    </div>
  `;
}
function toggleTechnical(btn) { btn.parentElement.classList.toggle('open'); }

function renderFight(fight, idx, total) {
  const id = slugify(`${fight.f1}-vs-${fight.f2}`);
  const mp = fight.sections.modelProjections;
  const f1Short = mp ? mp.f1Short : shortName(fight.f1);
  const f2Short = mp ? mp.f2Short : shortName(fight.f2);

  const prevFight = idx > 0 ? SYNOPSES.fights[idx - 1] : null;
  const nextFight = idx < total - 1 ? SYNOPSES.fights[idx + 1] : null;
  const prevId = prevFight ? slugify(`${prevFight.f1}-vs-${prevFight.f2}`) : '';
  const nextId = nextFight ? slugify(`${nextFight.f1}-vs-${nextFight.f2}`) : '';
  const prevLabel = prevFight ? `${shortName(prevFight.f1)} vs ${shortName(prevFight.f2)}` : '';
  const nextLabel = nextFight ? `${shortName(nextFight.f1)} vs ${shortName(nextFight.f2)}` : '';

  return `
    <div class="fight-pager">
      <button class="fight-pager-btn" ${prevFight ? `onclick="goToFight('${prevId}')"` : 'disabled'} title="${escape(prevLabel)}">
        ←  ${escape(prevLabel || 'Prev')}
      </button>
      <div class="fight-pager-current">Fight ${idx + 1} of ${total}</div>
      <button class="fight-pager-btn" ${nextFight ? `onclick="goToFight('${nextId}')"` : 'disabled'} title="${escape(nextLabel)}">
        ${escape(nextLabel || 'Next')}  →
      </button>
    </div>

    <div class="fight-card" id="${id}">
      <div class="fight-hero">
        <div class="matchup">${escape(fight.f1)} <span class="vs">vs</span> ${escape(fight.f2)}</div>
        <div class="meta">${fight.rounds} rounds  ·  ${escape(fight.division)}${fight.dataMode ? '  ·  ' + escape(fight.dataMode) + ' data mode' : ''}</div>
      </div>
      <div class="fight-card-body">
        ${renderLean(fight.sections.synopsis)}
        ${renderMatchupAnalysis(fight.sections.matchupAnalysis)}
        ${renderModelProjections(mp, fight.sections.overUnder)}
        ${renderPropEdges(fight)}
        ${renderMatchupEdges(fight.sections.matchupEdges)}
        ${renderComposites(fight.sections.composites, f1Short, f2Short)}
        ${renderStyleProfiles(fight.sections.styleProfiles, f1Short, f2Short)}
        ${renderProfiles(fight.sections.profiles)}
        ${renderTechnical(fight, f1Short, f2Short)}
      </div>
    </div>
  `;
}

function goToFight(id) {
  location.hash = id;
}

function renderCurrentFight() {
  if (!SYNOPSES) return;
  const hash = location.hash.slice(1);
  let idx = 0;
  if (hash) {
    const foundIdx = SYNOPSES.fights.findIndex(f => slugify(`${f.f1}-vs-${f.f2}`) === hash);
    if (foundIdx >= 0) idx = foundIdx;
  }
  const fight = SYNOPSES.fights[idx];
  if (!fight) return;
  document.getElementById('fight-content').innerHTML = renderFight(fight, idx, SYNOPSES.fights.length);
  // Update dropdown highlighting
  document.querySelectorAll('.nav-dropdown-item').forEach(a => {
    const href = a.getAttribute('href') || '';
    a.classList.toggle('current', href === '#' + slugify(`${fight.f1}-vs-${fight.f2}`));
  });
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderNavDropdown(fights) {
  const menu = document.getElementById('nav-fight-list');
  menu.innerHTML = fights.map(f => {
    const id = slugify(`${f.f1}-vs-${f.f2}`);
    return `<a class="nav-dropdown-item" href="#${id}" onclick="closeNavDropdown()">
      <div class="names">
        <div class="matchup-line">${escape(f.f1)} vs ${escape(f.f2)}</div>
        <div class="meta-line">${f.rounds}R · ${escape(f.division)}</div>
      </div>
    </a>`;
  }).join('');
}

function closeNavDropdown() {
  const tab = document.getElementById('synopsis-tab');
  tab.classList.remove('open');
}

document.addEventListener('DOMContentLoaded', () => {
  const tab = document.getElementById('synopsis-tab');
  tab.addEventListener('click', (e) => {
    if (window.matchMedia('(hover: none)').matches || window.innerWidth <= 720) {
      if (!e.target.closest('.nav-dropdown-menu')) {
        e.preventDefault();
        tab.classList.toggle('open');
      }
    }
  });
  document.addEventListener('click', (e) => {
    if (!tab.contains(e.target)) tab.classList.remove('open');
  });
});

async function loadSynopses() {
  try {
    const [synRes, csvRes] = await Promise.all([
      fetch('synopses.json?_=' + Date.now()),
      fetch('data.csv?_=' + Date.now())
    ]);
    if (!synRes.ok) throw new Error('synopses.json HTTP ' + synRes.status);
    SYNOPSES = await synRes.json();
    if (csvRes.ok) {
      const csv = await csvRes.text();
      const firstLine = csv.split('\n')[0].replace(/^#\s*/, '').trim();
      if (firstLine) document.getElementById('event-title').textContent = firstLine;
      try { PROP_EDGES = parseDataCsv(csv); } catch (e) { console.warn('CSV parse failed:', e); PROP_EDGES = null; }
    }
    document.getElementById('event-meta').textContent = SYNOPSES.generated ? SYNOPSES.generated.replace(/^Generated\s+/, '') : 'Synopses · Yang\'s Model';

    renderNavDropdown(SYNOPSES.fights);
    renderCurrentFight();
  } catch (e) {
    document.getElementById('fight-content').innerHTML = `<div class="loading">Failed to load synopses.json — ${escape(e.message)}</div>`;
  }
}

window.addEventListener('hashchange', renderCurrentFight);
loadSynopses();
</script>
</body>
</html>
